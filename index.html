<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>CYBER DELIVERY</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070910;
    color:#fff;
    font-family:Arial,sans-serif;
    touch-action:none;
}

button{
    font-family:inherit;
}

.screen{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:none;
}

.screen.active{
    display:flex;
}


/* =====================================================
   TITLE
===================================================== */

#titleScreen{
    background:
        radial-gradient(
            circle at center,
            #151b2b 0%,
            #080a11 55%,
            #05060a 100%
        );

    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.logo-small{
    color:#63f5ff;
    font-size:11px;
    letter-spacing:5px;
    margin-bottom:15px;
}

.logo{
    font-size:38px;
    font-weight:900;
    letter-spacing:4px;

    color:#fff;

    text-shadow:
        0 0 8px #63f5ff,
        0 0 25px rgba(99,245,255,.5);
}

.logo-sub{
    color:#ff3c91;
    font-size:12px;
    letter-spacing:5px;
    margin-top:10px;
}

.title-city{
    width:100%;
    max-width:360px;
    height:120px;
    margin:35px 0;

    border-top:1px solid #263044;
    border-bottom:1px solid #263044;

    position:relative;
    overflow:hidden;
}

.title-city::before,
.title-city::after{
    content:"";
    position:absolute;
    background:#63f5ff;
    opacity:.35;
}

.title-city::before{
    width:100%;
    height:1px;
    top:35px;
}

.title-city::after{
    width:1px;
    height:100%;
    left:55%;
}

.start-button{
    width:100%;
    max-width:360px;
    padding:17px;

    background:#101722;
    border:2px solid #63f5ff;

    color:#63f5ff;
    font-size:15px;
    font-weight:bold;
    letter-spacing:2px;
}

.version{
    margin-top:15px;
    color:#4d5564;
    font-size:9px;
}


/* =====================================================
   CARGO
===================================================== */

#cargoScreen{
    background:#080a11;

    flex-direction:column;

    padding:18px;

    overflow:hidden;
}

.cargo-header{
    flex-shrink:0;
    padding:5px 0 15px;
    border-bottom:1px solid #292f3b;
}

.cargo-header h1{
    margin:0;
    color:#63f5ff;
    font-size:21px;
    letter-spacing:2px;
}

.cargo-header p{
    margin:7px 0 0;
    color:#777f8e;
    font-size:11px;
}

.cargo-grid{
    flex:1;

    overflow-y:auto;

    padding:15px 0;

    display:grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:9px;

    touch-action:pan-y;
}

.cargo-card{
    position:relative;

    min-height:130px;

    padding:13px;

    background:#10141e;

    border:1px solid #303746;
}

.cargo-card.selected{
    border-color:#63f5ff;

    background:#101c25;

    box-shadow:
        inset 0 0 20px
        rgba(99,245,255,.08);
}

.cargo-icon{
    font-size:28px;
    margin-bottom:8px;
}

.cargo-name{
    color:#ddd;
    font-size:11px;
    font-weight:bold;
}

.cargo-destination{
    margin-top:6px;
    color:#777f8e;
    font-size:9px;
}

.cargo-reward{
    margin-top:9px;
    color:#63f5ff;
    font-size:10px;
}

.check{
    position:absolute;

    top:8px;
    right:8px;

    width:19px;
    height:19px;

    border:1px solid #454d5d;

    display:flex;

    align-items:center;
    justify-content:center;

    color:transparent;

    font-size:11px;
}

.cargo-card.selected .check{
    background:#63f5ff;
    color:#071016;
    border-color:#63f5ff;
}

.cargo-footer{
    flex-shrink:0;

    border-top:1px solid #292f3b;

    padding-top:12px;
}

.selected-count{
    color:#777f8e;
    text-align:center;
    font-size:10px;
    margin-bottom:9px;
}

.cargo-start{
    width:100%;

    padding:14px;

    background:#101722;

    border:2px solid #63f5ff;

    color:#63f5ff;

    font-weight:bold;
}

.cargo-start:disabled{
    border-color:#2d3340;
    color:#555b67;
}


/* =====================================================
   GAME
===================================================== */

#gameScreen{
    background:#070910;
}

#gameCanvas{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    image-rendering:pixelated;

    touch-action:none;
}


/* =====================================================
   HUD
===================================================== */

.hud{
    position:absolute;

    top:0;
    left:0;
    right:0;

    padding:8px;

    pointer-events:none;

    z-index:10;
}

.hud-inner{
    background:rgba(5,7,14,.94);

    border:1px solid #303847;

    padding:9px;

    display:flex;

    justify-content:space-between;

    font-size:10px;
}

.hud-item span{
    color:#63f5ff;
}

.hud-item.damage span{
    color:#ff648d;
}


/* =====================================================
   MESSAGE
===================================================== */

.mode-message{
    position:absolute;

    top:54px;

    left:10px;
    right:10px;

    text-align:center;

    padding:7px;

    background:rgba(5,7,14,.82);

    color:#aeb4c0;

    font-size:10px;

    pointer-events:none;

    z-index:10;
}


/* =====================================================
   DELIVERY STATUS
===================================================== */

.delivery-status{
    display:none;

    position:absolute;

    top:83px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(5,7,14,.94);

    border:1px solid #63f5ff;

    color:#63f5ff;

    padding:7px 13px;

    font-size:10px;

    white-space:nowrap;

    z-index:10;

    pointer-events:none;
}


/* =====================================================
   CARGO HUD
===================================================== */

.cargo-hud{
    position:absolute;

    top:107px;
    left:9px;

    width:160px;

    background:rgba(5,7,14,.86);

    border:1px solid #303847;

    padding:8px;

    z-index:8;

    pointer-events:none;
}

.cargo-hud-title{
    color:#63f5ff;

    font-size:9px;

    margin-bottom:5px;
}

.cargo-hud-item{
    color:#888f9d;

    font-size:8px;

    margin:4px 0;
}

.cargo-hud-item.delivered{
    color:#5cff9a;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
    position:absolute;

    left:10px;
    right:10px;
    bottom:10px;

    display:flex;

    gap:8px;

    z-index:20;
}

.control{
    flex:1;

    padding:14px 5px;

    background:rgba(10,13,21,.96);

    border:1px solid #3a4252;

    color:#bbb;

    font-size:12px;

    font-weight:bold;
}

.control.deliver{
    color:#63f5ff;
    border-color:#63f5ff;
}

.control:disabled{
    color:#555;
    border-color:#292e38;
}


/* =====================================================
   EVENT
===================================================== */

#event{
    display:none;

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(88%,360px);

    padding:20px;

    background:#11141e;

    border:2px solid #ffcf55;

    text-align:center;

    z-index:40;
}

#event h2{
    color:#ffcf55;
    font-size:17px;
}

#event p{
    color:#aaa;

    font-size:11px;

    line-height:1.6;
}

.event-button{
    width:100%;

    padding:12px;

    background:#181c27;

    border:1px solid #ffcf55;

    color:#ffcf55;
}


/* =====================================================
   RESULT
===================================================== */

#resultScreen{
    background:#080910;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.result-box{
    width:100%;
    max-width:400px;

    background:#11141e;

    border:2px solid #63f5ff;

    padding:21px;
}

.result-box h1{
    margin:0;

    text-align:center;

    color:#63f5ff;

    font-size:20px;
}

.grade{
    text-align:center;

    font-size:62px;

    color:#ffd75a;

    margin:13px 0 18px;
}

.result-row{
    display:flex;

    justify-content:space-between;

    padding:10px 0;

    border-bottom:1px solid #292f3a;

    font-size:12px;
}

.result-row strong{
    color:#63f5ff;
}

.restart{
    width:100%;

    margin-top:19px;

    padding:14px;

    background:#111722;

    border:2px solid #63f5ff;

    color:#63f5ff;

    font-weight:bold;
}

</style>
</head>

<body>


<!-- =====================================================
     TITLE
===================================================== -->

<section id="titleScreen" class="screen active">

    <div class="logo-small">
        NIGHT CITY LOGISTICS
    </div>

    <div class="logo">
        CYBER<br>DELIVERY
    </div>

    <div class="logo-sub">
        ROUTE • RISK • REWARD
    </div>

    <div class="title-city"></div>

    <button
        class="start-button"
        onclick="showCargoScreen()">

        START DELIVERY

    </button>

    <div class="version">
        MOBILE PROTOTYPE v0.5
    </div>

</section>


<!-- =====================================================
     CARGO
===================================================== -->

<section id="cargoScreen" class="screen">

    <div class="cargo-header">

        <h1>
            SELECT CARGO
        </h1>

        <p>
            배달할 물품을 선택하세요
        </p>

    </div>

    <div
        class="cargo-grid"
        id="cargoGrid">
    </div>

    <div class="cargo-footer">

        <div
            class="selected-count"
            id="selectedCount">

            선택된 물품: 0개

        </div>

        <button

            id="cargoStart"
            onclick="startRoutePlanning()"
            disabled>

            BEGIN ROUTE PLANNING

        </button>

    </div>

</section>


<!-- =====================================================
     GAME
===================================================== -->

<section id="gameScreen" class="screen">

    <canvas id="gameCanvas"></canvas>


    <div class="hud">

        <div class="hud-inner">

            <div class="hud-item">
                DIST
                <span id="distance">0m</span>
            </div>

            <div class="hud-item">
                CARGO

            </div>

                DAMAGE
                <span id="damage">0%</span>
            </div>

        </div>

    </div>


    <div
        class="mode-message"
        id="modeMessage">

        출발점에서 손가락을 누르고
        도로를 따라 경로를 그리세요

    </div>


    <div
        class="delivery-status"
        id="deliveryStatus">

        ● DELIVERING...

    </div>


    <div
        class="cargo-hud"
        id="cargoHud">

        <div class="cargo-hud-title">
            DELIVERY LIST
        </div>

    </div>


    <div class="controls">

        <button
            class="control"
            id="clearButton"
            onclick="clearRoute()">

            CLEAR

        </button>

        <button
            class="control deliver"
            id="deliverButton"
            onclick="startDelivery()"
            disabled>

            DELIVER

        </button>

    </div>


    <div id="event">

        <h2 id="eventTitle">
            EVENT
        </h2>

        <p id="eventText"></p>

        <button
            class="event-button"
            onclick="closeEvent()">

            CONTINUE

        </button>

    </div>

</section>


<!-- =====================================================
     RESULT
===================================================== -->

<section id="resultScreen" class="screen">

    <div class="result-box">

        <h1>
            DELIVERY COMPLETE
        </h1>

        <div
            class="grade"
            id="grade">

            A

        </div>

        <div class="result-row">
            <span>이동거리</span>
            <strong id="resultDistance">0m</strong>
        </div>

        <div class="result-row">
            <span>배송시간</span>
            <strong id="resultTime">0s</strong>
        </div>

        <div class="result-row">
            <span>배송품 손상</span>
            <strong id="resultDamage">0%</strong>
        </div>

        <div class="result-row">
            <span>경로 효율</span>
            <strong id="resultEfficiency">0%</strong>
        </div>

        <div class="result-row">
            <span>보상</span>
            <strong id="resultReward">¥0</strong>
        </div>

        <button
            class="restart"
            onclick="location.reload()">

            NEXT DELIVERY

        </button>

    </div>

</section>


<script>

/* =====================================================
   CARGO DATA
===================================================== */

const cargoData=[

    {
        id:"ramen",
        icon:"🍜",
        name:"NEON RAMEN",
        destination:"Noodle District",
        x:.80,
        y:.20,
        damageRate:.7,
        reward:1200
    },

    {
        id:"medicine",
        icon:"💊",
        name:"MEDICAL CHIP",
        destination:"Medical Sector",
        x:.80,
        y:.80,
        damageRate:1.4,
        reward:2200
    },

    {
        id:"component",
        icon:"🔧",
        name:"CYBER COMPONENT",
        destination:"Industrial Zone",
        x:.20,
        y:.80,
        damageRate:.35,
        reward:1500
    },

    {
        id:"data",
        icon:"💾",
        name:"ENCRYPTED DATA",
        destination:"Data District",
        x:.20,
        y:.20,
        damageRate:.25,
        reward:3000
    },

    {
        id:"bio",
        icon:"🧬",
        name:"BIO SAMPLE",
        destination:"Bio Lab",
        x:.50,
        y:.80,
        damageRate:1.8,
        reward:2800
    },

    {
        id:"luxury",
        icon:"💎",
        name:"LUXURY CHIP",
        destination:"Corporate Tower",
        x:.50,
        y:.20,
        damageRate:1.5,
        reward:5000
    }

];

let selectedCargo=[];


/* =====================================================
   DOM CACHE
===================================================== */

const $=id=>document.getElementById(id);

const titleScreen=$("titleScreen");
const cargoScreen=$("cargoScreen");
const gameScreen=$("gameScreen");
const resultScreen=$("resultScreen");

const cargoGrid=$("cargoGrid");
const selectedCount=$("selectedCount");
const cargoStart=$("cargoStart");

const distanceEl=$("distance");
const cargoCountEl=$("cargoCount");
const damageEl=$("damage");

const modeMessage=$("modeMessage");
const deliveryStatus=$("deliveryStatus");
const cargoHud=$("cargoHud");

const clearButton=$("clearButton");
const deliverButton=$("deliverButton");

const eventBox=$("event");
const eventTitle=$("eventTitle");
const eventText=$("eventText");


/* =====================================================
   SCREEN
===================================================== */

function showScreen(screen){

    titleScreen.classList.remove("active");
    cargoScreen.classList.remove("active");
    gameScreen.classList.remove("active");
    resultScreen.classList.remove("active");

    screen.classList.add("active");
}


/* =====================================================
   CARGO
===================================================== */

function showCargoScreen(){

    showScreen(cargoScreen);

    renderCargo();
}


function renderCargo(){

    cargoGrid.innerHTML="";

    const selectedSet=new Set(selectedCargo);

    cargoData.forEach(item=>{

        const card=document.createElement("div");

        card.className="cargo-card";

        if(selectedSet.has(item.id))
            card.classList.add("selected");

        card.innerHTML=`

            <div class="check">✓</div>

            <div class="cargo-icon">
                ${item.icon}
            </div>

            <div class="cargo-name">
                ${item.name}
            </div>

            <div class="cargo-destination">
                → ${item.destination}
            </div>

            <div class="cargo-reward">
                ¥${item.reward.toLocaleString()}
            </div>

        `;

        card.addEventListener(
            "click",
            ()=>toggleCargo(item.id)
        );

        cargoGrid.appendChild(card);

    });

    updateCargoSelection();
}


function toggleCargo(id){

    const index=selectedCargo.indexOf(id);

    if(index>=0)
        selectedCargo.splice(index,1);
    else
        selectedCargo.push(id);

    renderCargo();
}


function updateCargoSelection(){

    selectedCount.textContent=
        "선택된 물품: "+
        selectedCargo.length+
        "개";

    cargoStart.disabled=
        selectedCargo.length===0;
}


/* =====================================================
   ROAD MAP
   각 도로를 하나의 블록으로 취급
===================================================== */

/*
   road:
   x1,y1 -> x2,y2

   type:
   horizontal / vertical
*/

const roads=[

    {id:0,x1:.08,y1:.20,x2:.92,y2:.20,type:"h"},
    {id:1,x1:.08,y1:.50,x2:.92,y2:.50,type:"h"},
    {id:2,x1:.08,y1:.80,x2:.92,y2:.80,type:"h"},

    {id:3,x1:.20,y1:.08,x2:.20,y2:.92,type:"v"},
    {id:4,x1:.50,y1:.08,x2:.50,y2:.92,type:"v"},
    {id:5,x1:.80,y1:.08,x2:.80,y2:.92,type:"v"}

];


const startPoint={
    x:.08,
    y:.50
};


/* =====================================================
   GAME STATE
===================================================== */

let route=[];

/*
   routeRoads:
   실제로 선택된 도로의 순서
*/
let routeRoads=[];

/*
   visitedRoads:
   이미 지나간 도로.
   CLEAR 전까지 절대 삭제하지 않는다.
*/
let visitedRoads=new Set();

let routeDistance=0;

let drawing=false;

let planning=false;

let delivering=false;

let pausedByEvent=false;

let deliveryProgress=0;

let deliveryStart=0;

let deliveryElapsed=0;

let damage=0;

let deliveredCargo=new Set();

let triggeredEvents=new Set();

let W=0;
let H=0;


/* =====================================================
   CANVAS
===================================================== */

const canvas=$("gameCanvas");
const ctx=canvas.getContext("2d");

function resize(){

    const dpr=Math.min(
        window.devicePixelRatio||1,
        2
    );

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );

    draw();
}

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   ROAD HELPERS
===================================================== */

function getRoadPoint(road,t){

    return{
        x:
            road.x1+
            (road.x2-road.x1)*t,

        y:
            road.y1+
            (road.y2-road.y1)*t
    };
}


function roadLength(road){

    return Math.hypot(
        (road.x2-road.x1)*W,
        (road.y2-road.y1)*H
    );
}


/*
   손가락 위치에서 가장 가까운 도로를 찾는다.

   기존의 모든 선분 검사 대신
   도로 6개만 검사하므로 훨씬 가볍다.
*/

function findRoad(x,y){

    let best=null;
    let bestDistance=Infinity;
    let bestT=0;

    for(const road of roads){

        let t;

        if(road.type==="h"){

            t=
                (x/W-road.x1)/
                (road.x2-road.x1);

            t=Math.max(
                0,
                Math.min(1,t)
            );

        }else{

            t=
                (y/H-road.y1)/
                (road.y2-road.y1);

            t=Math.max(
                0,
                Math.min(1,t)
            );
        }

        const point=
            getRoadPoint(
                road,
                t
            );

        const dx=
            x-point.x*W;

        const dy=
            y-point.y*H;

        const distance=
            Math.hypot(dx,dy);

        /*
           도로 폭 + 터치 여유
        */

        if(
            distance<75 &&
            distance<bestDistance
        ){

            bestDistance=distance;

            best={
                road,
                t,
                point,
                distance
            };
        }
    }

    return best;
}


/*
   두 도로가 교차하는지 확인
*/

function roadsConnected(a,b){

    if(!a || !b)
        return false;

    if(a.id===b.id)
        return false;

    /*
       수평 + 수직
    */

    if(a.type!==b.type){

        const h=
            a.type==="h"
            ? a
            : b;

        const v=
            a.type==="v"
            ? a
            : b;

        return(
            v.x1>=h.x1 &&
            v.x1<=h.x2 &&
            h.y1>=v.y1 &&
            h.y1<=v.y2
        );
    }

    /*
       평행한 도로는 연결되지 않는다.
       같은 도로만 계속 따라갈 수 있다.
    */

    return false;
}


/*
   두 도로의 교차점
*/

function getIntersection(a,b){

    if(!roadsConnected(a,b))
        return null;

    const h=
        a.type==="h"
        ? a
        : b;

    const v=
        a.type==="v"
        ? a
        : b;

    return{
        x:v.x1,
        y:h.y1
    };
}


/* =====================================================
   BUILD ROUTE
===================================================== */

function rebuildRoute(){

    route=[];

    if(
        routeRoads.length===0
    ){

        routeDistance=0;

        return;
    }


    /*
       시작점
    */

    route.push({
        x:startPoint.x,
        y:startPoint.y
    });


    for(
        let i=0;
        i<routeRoads.length;
        i++
    ){

        const road=routeRoads[i];


        /*
           첫 도로
        */

        if(i===0){

            /*
               시작점에서 해당 도로 위로
            */

            let t;

            if(road.type==="h"){

                t=
                    (
                        startPoint.x-
                        road.x1
                    )/
                    (
                        road.x2-
                        road.x1
                    );

            }else{

                t=
                    (
                        startPoint.y-
                        road.y1
                    )/
                    (
                        road.y2-
                        road.y1
                    );
            }


            t=Math.max(
                0,
                Math.min(1,t)
            );


            /*
               시작점과 반대쪽 방향으로
               도로를 따라가도록 끝점을 만든다.
            */

            const p=
                getRoadPoint(
                    road,
                    1
                );

            const startOnRoad=
                getRoadPoint(
                    road,
                    t
                );


            if(
                Math.hypot(
                    (
                        startOnRoad.x-
                        startPoint.x
                    )*W,
                    (
                        startOnRoad.y-
                        startPoint.y
                    )*H
                )>2
            ){

                route.push(
                    startOnRoad
                );
            }


            /*
               첫 도로의 끝
            */

            route.push(p);

            continue;
        }


        const previous=
            routeRoads[i-1];

        const corner=
            getIntersection(
                previous,
                road
            );

        if(corner){

            route.push(corner);

            /*
               새 도로의 반대쪽 끝으로 이동
            */

            let endpoint;

            if(
                Math.abs(
                    road.x1-corner.x
                )+
                Math.abs(
                    road.y1-corner.y
                )
                <
                Math.abs(
                    road.x2-corner.x
                )+
                Math.abs(
                    road.y2-corner.y
                )
            ){

                endpoint={
                    x:road.x2,
                    y:road.y2
                };

            }else{

                endpoint={
                    x:road.x1,
                    y:road.y1
                };
            }

            route.push(endpoint);
        }
    }


    /*
       중복점 제거
    */

    const clean=[];

    for(const p of route){

        const last=
            clean[clean.length-1];

        if(
            !last ||
            Math.hypot(
                (p.x-last.x)*W,
                (p.y-last.y)*H
            )>1
        ){

            clean.push(p);
        }
    }

    route=clean;

    routeDistance=
        calculateRouteDistance();
}


/* =====================================================
   START PLANNING
===================================================== */

function startRoutePlanning(){

    showScreen(gameScreen);

    planning=true;
    delivering=false;
    pausedByEvent=false;
    drawing=false;

    route=[];
    routeRoads=[];
    visitedRoads.clear();

    routeDistance=0;

    damage=0;

    deliveredCargo.clear();
    triggeredEvents.clear();

    modeMessage.textContent=
        "출발점에서 손가락을 누르고 도로를 따라 경로를 그리세요";

    deliveryStatus.style.display="none";

    clearButton.disabled=false;

    updateCargoHud();
    updateHUD();
    updateDeliverButton();

    resize();
}


/* =====================================================
   ADD ROAD
===================================================== */

function tryAddRoad(hit){

    if(!hit)
        return false;

    const road=hit.road;

    /*
       이미 방문한 도로는 절대 추가하지 않는다.
    */

    if(
        visitedRoads.has(road.id)
    ){

        showTemporaryMessage(
            "이미 지나간 도로입니다"
        );

        return false;
    }


    /*
       첫 도로는 출발점에서 시작
    */

    if(
        routeRoads.length===0
    ){

        /*
           출발점과 도로가 연결되어 있는지 확인
        */

        const sx=startPoint.x*W;
        const sy=startPoint.y*H;

        if(
            Math.hypot(
                hit.point.x*W-sx,
                hit.point.y*H-sy
            )>85
        ){

            showTemporaryMessage(
                "출발점 근처에서 시작하세요"
            );

            return false;
        }

        routeRoads.push(road);
        visitedRoads.add(road.id);

        rebuildRoute();

        return true;
    }


    const previous=
        routeRoads[
            routeRoads.length-1
        ];


    /*
       같은 도로라면 계속 이동 가능.
       하지만 이미 route에 있으므로
       새 도로로 추가하지 않는다.
    */

    if(
        road.id===previous.id
    ){

        return true;
    }


    /*
       반드시 교차로에서만
       다른 도로로 이동 가능.
    */

    if(
        !roadsConnected(
            previous,
            road
        )
    ){

        showTemporaryMessage(
            "교차로에서 다른 도로로 이동하세요"
        );

        return false;
    }


    /*
       이미 방문한 도로면 막는다.
    */

    if(
        visitedRoads.has(road.id)
    ){

        showTemporaryMessage(
            "이미 지나간 도로입니다"
        );

        return false;
    }


    /*
       새 도로 추가
    */

    routeRoads.push(road);

    visitedRoads.add(road.id);

    rebuildRoute();

    checkDestinationsOnRoute();

    updateAll();
    draw();

    return true;
}


/* =====================================================
   POINTER DOWN
===================================================== */

function pointerDown(e){

    e.preventDefault();

    if(
        !planning ||
        delivering ||
        pausedByEvent
    )
        return;

    const rect=
        canvas.getBoundingClientRect();

    const x=
        e.clientX-
        rect.left;

    const y=
        e.clientY-
        rect.top;

    const hit=
        findRoad(x,y);

    if(!hit)
        return;


    /*
       이미 경로가 있다면
       현재 경로의 마지막 도로에서
       계속 이어야 한다.
    */

    if(routeRoads.length>0){

        const last=
            routeRoads[
                routeRoads.length-1
            ];

        if(
            hit.road.id!==last.id &&
            !roadsConnected(
                last,
                hit.road
            )
        ){

            showTemporaryMessage(
                "현재 경로의 끝에서 이어가세요"
            );

            return;
        }
    }


    if(
        tryAddRoad(hit)
    ){

        drawing=true;

        checkDestinationsOnRoute();

        updateAll();
        draw();
    }
}


/* =====================================================
   POINTER MOVE
===================================================== */

function pointerMove(e){

    e.preventDefault();

    if(
        !drawing ||
        !planning ||
        delivering ||
        pausedByEvent
    )
        return;

    const rect=
        canvas.getBoundingClientRect();

    const x=
        e.clientX-
        rect.left;

    const y=
        e.clientY-
        rect.top;

    const hit=
        findRoad(x,y);

    if(!hit)
        return;


    /*
       현재 도로 안에서는 아무 작업도 하지 않는다.
       이것이 기존 랙의 큰 원인을 제거한다.
    */

    if(
        routeRoads.length>0 &&
        hit.road.id===
        routeRoads[
            routeRoads.length-1
        ].id
    ){

        return;
    }


    /*
       새 도로로 이동
    */

    tryAddRoad(hit);

    checkDestinationsOnRoute();

    updateAll();
    draw();
}


/* =====================================================
   POINTER UP
===================================================== */

function pointerUp(e){

    if(e)
        e.preventDefault();

    /*
       손가락을 떼어도
       경로는 절대 초기화하지 않는다.
    */

    drawing=false;

    updateDeliverButton();

    draw();
}


/* =====================================================
   DESTINATION
===================================================== */

function checkDestinationsOnRoute(){

    if(route.length===0)
        return;

    for(const item of cargoData){

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            continue;

        if(
            deliveredCargo.has(
                item.id
            )
        )
            continue;

        for(const p of route){

            if(
                Math.hypot(
                    p.x-item.x,
                    p.y-item.y
                )<.065
            ){

                deliveredCargo.add(
                    item.id
                );

                break;
            }
        }
    }
}


/* =====================================================
   CLEAR
===================================================== */

function clearRoute(){

    if(!planning)
        return;

    route=[];
    routeRoads=[];

    /*
       여기서만 방문 기록을 초기화한다.
    */

    visitedRoads.clear();

    routeDistance=0;

    deliveredCargo.clear();

    drawing=false;

    modeMessage.textContent=
        "출발점에서 손가락을 누르고 도로를 따라 경로를 그리세요";

    updateAll();
    draw();
}


/* =====================================================
   ROUTE DISTANCE
===================================================== */

function calculateRouteDistance(){

    let total=0;

    for(
        let i=1;
        i<route.length;
        i++
    ){

        total+=Math.hypot(
            (
                route[i].x-
                route[i-1].x
            )*W,

            (
                route[i].y-
                route[i-1].y
            )*H
        );
    }

    return total;
}


/* =====================================================
   DELIVER BUTTON
===================================================== */

function updateDeliverButton(){

    const complete=
        selectedCargo.length>0 &&
        deliveredCargo.size===
        selectedCargo.length;

    deliverButton.disabled=
        !complete ||
        route.length<2 ||
        delivering;
}


/* =====================================================
   UPDATE
===================================================== */

function updateAll(){

    updateHUD();
    updateCargoHud();
    updateDeliverButton();
}


/* =====================================================
   START DELIVERY
===================================================== */

function startDelivery(){

    if(
        !planning ||
        delivering
    )
        return;

    if(
        deliveredCargo.size!==
        selectedCargo.length
    )
        return;

    planning=false;
    delivering=true;
    pausedByEvent=false;

    damage=0;

    deliveryProgress=0;

    deliveryStart=
        performance.now();

    deliveryElapsed=0;

    deliveredCargo.clear();

    clearButton.disabled=true;
    deliverButton.disabled=true;

    modeMessage.textContent=
        "계획한 경로를 따라 배송 중";

    deliveryStatus.style.display=
        "block";

    updateCargoHud();

    deliveryLoop.lastTime=null;

    requestAnimationFrame(
        deliveryLoop
    );
}


/* =====================================================
   DELIVERY LOOP
===================================================== */

function deliveryLoop(now){

    if(!delivering)
        return;


    /*
       이벤트가 열린 동안
       캐릭터는 완전히 정지한다.
    */

    if(pausedByEvent){

        deliveryLoop.lastTime=now;

        requestAnimationFrame(
            deliveryLoop
        );

        return;
    }


    if(
        deliveryLoop.lastTime===null
    ){

        deliveryLoop.lastTime=now;
    }


    const dt=
        Math.min(
            .05,
            (
                now-
                deliveryLoop.lastTime
            )/1000
        );

    deliveryLoop.lastTime=now;

    deliveryElapsed=
        (
            now-
            deliveryStart
        )/1000;


    /*
       빠른 배송 속도
    */

    const speed=500;

    let remaining=
        speed*dt;


    while(
        remaining>0 &&
        deliveryProgress<
        route.length-1
    ){

        const index=
            Math.floor(
                deliveryProgress
            );

        const fraction=
            deliveryProgress-index;

        const a=
            route[index];

        const b=
            route[index+1];

        const segmentLength=
            Math.hypot(
                (
                    b.x-a.x
                )*W,

                (
                    b.y-a.y
                )*H
            );


        if(segmentLength<=0){

            deliveryProgress=
                index+1;

            continue;
        }


        const remainingOnSegment=
            segmentLength*
            (1-fraction);


        if(
            remaining<
            remainingOnSegment
        ){

            deliveryProgress+=
                remaining/
                segmentLength;

            remaining=0;

        }else{

            remaining-=
                remainingOnSegment;

            deliveryProgress=
                index+1;
        }
    }


    checkDeliveryDestinations();


    const rate=
        getDamageRate();


    damage+=
        speed*
        dt*
        .002*
        rate;


    damage=Math.min(
        100,
        damage
    );


    checkEvent();

    updateHUD();
    updateCargoHud();

    drawDelivery();


    if(
        deliveryProgress>=
        route.length-1
    ){

        finishDelivery();

        return;
    }


    requestAnimationFrame(
        deliveryLoop
    );
}


/* =====================================================
   DELIVERY POSITION
===================================================== */

function getDeliveryPosition(){

    if(route.length===0)
        return startPoint;

    const index=
        Math.floor(
            deliveryProgress
        );


    if(
        index>=route.length-1
    ){

        return route[
            route.length-1
        ];
    }


    const fraction=
        deliveryProgress-index;

    const a=
        route[index];

    const b=
        route[index+1];


    return{

        x:
            a.x+
            (
                b.x-a.x
            )*fraction,

        y:
            a.y+
            (
                b.y-a.y
            )*fraction

    };
}


/* =====================================================
   DELIVERY DESTINATIONS
===================================================== */

function checkDeliveryDestinations(){

    const p=
        getDeliveryPosition();

    for(const item of cargoData){

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            continue;

        if(
            deliveredCargo.has(
                item.id
            )
        )
            continue;

        const d=
            Math.hypot(
                p.x-item.x,
                p.y-item.y
            );

        if(d<.065){

            deliveredCargo.add(
                item.id
            );
        }
    }
}


/* =====================================================
   DAMAGE
===================================================== */

function getDamageRate(){

    let total=0;
    let count=0;

    for(const id of selectedCargo){

        const item=
            cargoData.find(
                x=>x.id===id
            );

        if(item){

            total+=item.damageRate;
            count++;
        }
    }

    return count
        ? total/count
        : 1;
}


/* =====================================================
   EVENT
===================================================== */

function checkEvent(){

    if(
        triggeredEvents.has(
            "center"
        )
    )
        return;


    const p=
        getDeliveryPosition();


    if(
        Math.hypot(
            p.x-.50,
            p.y-.50
        )<.035
    ){

        triggeredEvents.add(
            "center"
        );

        damage+=5;

        /*
           배송 차량 즉시 정지
        */

        pausedByEvent=true;


        showEvent(
            "⚡ ELECTROMAGNETIC STORM",

            "도시 중앙을 지나던 중 강한<br>"+
            "전자기 폭풍이 발생했습니다.<br><br>"+
            "배송품 손상도 +5%"
        );
    }
}


function showEvent(
    title,
    text
){

    eventTitle.textContent=
        title;

    eventText.innerHTML=
        text;

    eventBox.style.display=
        "block";
}


function closeEvent(){

    eventBox.style.display=
        "none";

    /*
       확인 버튼을 누른 뒤에만 재개
    */

    pausedByEvent=false;

    deliveryLoop.lastTime=
        performance.now();

    if(delivering){

        requestAnimationFrame(
            deliveryLoop
        );
    }
}


/* =====================================================
   FINISH
===================================================== */

function finishDelivery(){

    delivering=false;
    pausedByEvent=false;

    deliveryLoop.lastTime=null;

    deliveryStatus.style.display=
        "none";

    damage=Math.min(
        100,
        damage
    );


    const ideal=
        getIdealDistance();


    const efficiency=
        Math.max(
            0,
            Math.min(
                100,

                100-
                Math.max(
                    0,
                    routeDistance-
                    ideal
                )/8
            )
        );


    let reward=0;


    for(const id of selectedCargo){

        const item=
            cargoData.find(
                x=>x.id===id
            );

        if(item)
            reward+=item.reward;
    }


    reward*=
        Math.max(
            .2,
            1-damage/100
        );


    reward*=
        efficiency/100;


    const score=
        efficiency*.55+
        (100-damage)*.45;


    let grade="D";


    if(score>=92)
        grade="S";

    else if(score>=82)
        grade="A";

    else if(score>=68)
        grade="B";

    else if(score>=52)
        grade="C";


    $("resultDistance").textContent=
        Math.round(routeDistance)+"m";

    $("resultTime").textContent=
        deliveryElapsed.toFixed(1)+"s";

    $("resultDamage").textContent=
        damage.toFixed(1)+"%";

    $("resultEfficiency").textContent=
        Math.round(efficiency)+"%";

    $("resultReward").textContent=
        "¥ "+
        Math.round(
            reward
        ).toLocaleString();

    $("grade").textContent=
        grade;


    showScreen(resultScreen);
}


/* =====================================================
   IDEAL DISTANCE
===================================================== */

function getIdealDistance(){

    return(
        750+
        selectedCargo.length*90
    );
}

   HUD

function updateHUD(){

   CARGO HUD

function updateCargoHud(){

        </div>

/* =====================================================
   TEMPORARY MESSAGE
===================================================== */

let messageTimer=null;


function showTemporaryMessage(text){

    modeMessage.textContent=text;

    clearTimeout(
        messageTimer
    );

    messageTimer=
        setTimeout(
            ()=>{

                if(planning){

                    modeMessage.textContent=
                        "출발점에서 손가락을 누르고 도로를 따라 경로를 그리세요";

                }

            },
            1400
        );
}


/* =====================================================
   DRAW MAP
===================================================== */

function draw(){

    if(!W || !H)
        return;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       BACKGROUND
    */

    ctx.fillStyle="#070910";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       CITY BLOCKS
    */

    for(
        let x=0;
        x<W;
        x+=42
    ){

        for(
            let y=0;
            y<H;
            y+=42
        ){

            const roadX=
                roads.some(
                    r=>
                        r.type==="v" &&
                        Math.abs(
                            x/W-r.x1
                        )<.07
                );

            const roadY=
                roads.some(
                    r=>
                        r.type==="h" &&
                        Math.abs(
                            y/H-r.y1
                        )<.07
                );

            if(
                roadX||
                roadY
            )
                continue;


            ctx.fillStyle=
                (
                    (x+y)/42
                )%2===0
                ? "#111521"
                : "#0d111a";


            ctx.fillRect(
                x+2,
                y+2,
                36,
                36
            );
        }
    }


    /*
       ROADS
    */

    for(const road of roads){

        ctx.beginPath();

        ctx.moveTo(
            road.x1*W,
            road.y1*H
        );

        ctx.lineTo(
            road.x2*W,
            road.y2*H
        );

        ctx.lineWidth=31;

        ctx.strokeStyle="#252a36";

        ctx.stroke();


        ctx.lineWidth=2;

        ctx.strokeStyle="#4a5060";

        ctx.stroke();


        ctx.setLineDash(
            [8,9]
        );

        ctx.lineWidth=1;

        ctx.strokeStyle=
            "rgba(130,140,155,.35)";

        ctx.stroke();

        ctx.setLineDash([]);


        /*
           이미 방문한 도로 표시
        */

        if(
            planning &&
            visitedRoads.has(
                road.id
            )
        ){

            ctx.lineWidth=4;

            ctx.strokeStyle=
                "rgba(99,245,255,.12)";

            ctx.stroke();
        }
    }


    /*
       EVENT MARKER
    */

    ctx.fillStyle="#ffcf55";

    ctx.shadowColor="#ffcf55";

    ctx.shadowBlur=10;

    ctx.beginPath();

    ctx.arc(
        W*.50,
        H*.50,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;


    /*
       DESTINATIONS
    */

    for(const item of cargoData){

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            continue;


        const x=item.x*W;
        const y=item.y*H;

        const done=
            deliveredCargo.has(
                item.id
            );


        ctx.strokeStyle=
            done
            ? "#5cff9a"
            : "#ffcf55";

        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            17,
            0,
            Math.PI*2
        );

        ctx.stroke();


        ctx.fillStyle=
            done
            ? "#5cff9a"
            : "#ffcf55";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#080910";

        ctx.font=
            "bold 10px Arial";

        ctx.textAlign="center";
        ctx.textBaseline="middle";


        ctx.fillText(
            done?"✓":"!",
            x,
            y
        );
    }


    /*
       ROUTE
    */

    if(
        route.length>1
    ){

        ctx.save();

        ctx.beginPath();

        for(
            let i=0;
            i<route.length;
            i++
        ){

            const x=
                route[i].x*W;

            const y=
                route[i].y*H;


            if(i===0)
                ctx.moveTo(x,y);

            else
                ctx.lineTo(x,y);
        }


        ctx.lineJoin="miter";
        ctx.lineCap="square";


        ctx.lineWidth=12;

        ctx.strokeStyle=
            delivering
            ? "rgba(255,60,145,.18)"
            : "rgba(99,245,255,.20)";

        ctx.stroke();


        ctx.lineWidth=5;

        ctx.strokeStyle=
            delivering
            ? "#ff3c91"
            : "#63f5ff";

        ctx.shadowColor=
            delivering
            ? "#ff3c91"
            : "#63f5ff";

        ctx.shadowBlur=10;

        ctx.stroke();

        ctx.restore();
    }


    /*
       START
    */

    const sx=
        startPoint.x*W;

    const sy=
        startPoint.y*H;


    ctx.fillStyle="#63f5ff";

    ctx.shadowColor="#63f5ff";

    ctx.shadowBlur=12;


    ctx.beginPath();

    ctx.arc(
        sx,
        sy,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;


    ctx.fillStyle="#071016";

    ctx.font=
        "bold 10px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";


    ctx.fillText(
        "S",
        sx,
        sy
    );


    /*
       START HIGHLIGHT
    */

    if(
        planning &&
        routeRoads.length===0
    ){

        ctx.strokeStyle=
            "rgba(99,245,255,.35)";

        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            23,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    /*
       CURRENT END
    */

    if(
        planning &&
        route.length>1
    ){

        const last=
            route[
                route.length-1
            ];


        ctx.fillStyle="#fff";

        ctx.shadowColor="#63f5ff";

        ctx.shadowBlur=12;


        ctx.beginPath();

        ctx.arc(
            last.x*W,
            last.y*H,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.shadowBlur=0;
    }
}


/* =====================================================
   DELIVERY DRAW
===================================================== */

function drawDelivery(){

    draw();


    const p=
        getDeliveryPosition();


    ctx.save();


    ctx.shadowColor="#ff3c91";

    ctx.shadowBlur=20;

    ctx.fillStyle="#ff3c91";


    ctx.beginPath();

    ctx.arc(
        p.x*W,
        p.y*H,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.fillStyle="#fff";


    ctx.beginPath();

    ctx.arc(
        p.x*W+5,
        p.y*H-4,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}
