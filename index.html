<style>

html,body{

    height:100%;

button{

/* =====================================================

===================================================== */

.logo{

.start-button{

}

.version{

/* =====================================================
   CARGO
===================================================== */

.cargo-card{

}

.cargo-card.selected{

.cargo-icon{

.cargo-name{

.cargo-destination{

.cargo-reward{

    justify-content:center;

    font-size:11px;
}

.cargo-card.selected .check{

}

.cargo-footer{

}

.selected-count{

.cargo-start{

}

.cargo-start:disabled{

/* =====================================================
   GAME
===================================================== */

#gameScreen{

===================================================== */

<script>

let selectedCargo=[];


/* =====================================================

===================================================== */

const $=id=>document.getElementById(id);

const titleScreen=$("titleScreen");

const distanceEl=$("distance");

/* =====================================================
   SCREEN
===================================================== */

function showScreen(screen){

    titleScreen.classList.remove("active");
    cargoScreen.classList.remove("active");
    gameScreen.classList.remove("active");
    resultScreen.classList.remove("active");

    screen.classList.add("active");
}


/* =====================================================
   CARGO
===================================================== */

function showCargoScreen(){

    showScreen(cargoScreen);

    renderCargo();
}


function renderCargo(){

    cargoGrid.innerHTML="";

    const selectedSet=
        new Set(selectedCargo);


    cargoData.forEach(item=>{

        const card=
            document.createElement("div");

        card.className=
            "cargo-card";


        if(selectedSet.has(item.id))
            card.classList.add("selected");


        card.innerHTML=`

            <div class="check">✓</div>

            <div class="cargo-icon">
                ${item.icon}
            </div>

            <div class="cargo-name">
                ${item.name}
            </div>

            <div class="cargo-destination">
                → ${item.destination}
            </div>

            <div class="cargo-reward">
                ¥${item.reward.toLocaleString()}
            </div>

        `;


        card.addEventListener(
            "click",
            ()=>{
                toggleCargo(item.id);
            }
        );


        cargoGrid.appendChild(card);

    });


    updateCargoSelection();
}


function toggleCargo(id){

    const index=
        selectedCargo.indexOf(id);


    if(index>=0)
        selectedCargo.splice(index,1);

    else
        selectedCargo.push(id);


    renderCargo();
}


function updateCargoSelection(){

    selectedCount.textContent=

    cargoStart.disabled=
        selectedCargo.length===0;
}


/* =====================================================
   MAP
===================================================== */

const roads=[

    [
        [.08,.20],
        [.20,.20],
        [.35,.20],
        [.50,.20],

    ],

    ],

    ],

    [

        [.20,.50],

    ],

    [

        [.50,.20],
        [.50,.50],

    ],

        [.80,.08],

    ]

];


const startPoint={
    x:.08,

};


/* =====================================================
   GAME STATE
===================================================== */

let route=[];

let routeDistance=0;

let drawing=false;

let planning=false;

let delivering=false;

let pausedByEvent=false;

let deliveryProgress=0;

let deliveryStart=0;

let deliveryElapsed=0;

let damage=0;

let deliveredCargo=new Set();

let visitedSegments=new Set();

let triggeredEvents=new Set();

let currentSegment=null;


/*
    경로를 구성하는 도로 segment 목록
*/

let routeSegments=[];


let W=0;
let H=0;


/* =====================================================
   CANVAS
===================================================== */

const canvas=
    $("gameCanvas");

const ctx=
    canvas.getContext("2d");


function resize(){

    const dpr=
        Math.min(
            window.devicePixelRatio||1,
            2
        );


    W=window.innerWidth;
    H=window.innerHeight;


    canvas.width=
        W*dpr;

    canvas.height=
        H*dpr;


    canvas.style.width=
        W+"px";

    canvas.style.height=
        H+"px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    draw();
}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   ROUTE PLANNING
===================================================== */

function startRoutePlanning(){

    showScreen(gameScreen);


    planning=true;
    delivering=false;
    pausedByEvent=false;
    drawing=false;


    route=[];
    routeDistance=0;


    damage=0;


    deliveredCargo.clear();
    visitedSegments.clear();
    triggeredEvents.clear();


    routeSegments=[];
    currentSegment=null;


    modeMessage.textContent=
        "출발점에서 손가락을 누르고 도로를 따라 경로를 그리세요";


    deliveryStatus.style.display=
        "none";


    clearButton.disabled=false;


    updateCargoHud();
    updateHUD();
    updateDeliverButton();


    resize();
}


/* =====================================================
   ROAD POINT
===================================================== */

function roadPoint(x,y){

    let bestPoint=null;
    let bestDistance=Infinity;

    let bestRoad=-1;
    let bestSegment=-1;


    for(
        let r=0;
        r<roads.length;
        r++
    ){

        const road=roads[r];


        for(
            let s=0;
            s<road.length-1;
            s++
        ){

            const ax=
                road[s][0]*W;

            const ay=
                road[s][1]*H;

            const bx=
                road[s+1][0]*W;

            const by=
                road[s+1][1]*H;


            const dx=bx-ax;
            const dy=by-ay;


            const len2=
                dx*dx+
                dy*dy;


            let t=
                (
                    (x-ax)*dx+
                    (y-ay)*dy
                )/len2;


            t=Math.max(
                0,
                Math.min(1,t)
            );


            const px=
                ax+dx*t;

            const py=
                ay+dy*t;


            const d=
                Math.hypot(
                    x-px,
                    y-py
                );


            if(d<bestDistance){

                bestDistance=d;

                bestPoint={
                    x:px/W,
                    y:py/H
                };

                bestRoad=r;
                bestSegment=s;
            }
        }
    }


    return{
        point:bestPoint,
        distance:bestDistance,
        road:bestRoad,
        segment:bestSegment
    };
}


/* =====================================================
   SEGMENT
===================================================== */

function segmentKey(
    road,
    segment
){

    return road+"_"+segment;
}


function getSegment(
    road,
    segment
){

    if(
        road<0 ||
        segment<0 ||
        !roads[road] ||
        !roads[road][segment] ||
        !roads[road][segment+1]
    ){

        return null;
    }


    return{

        a:{
            x:roads[road][segment][0],
            y:roads[road][segment][1]
        },

        b:{
            x:roads[road][segment+1][0],
            y:roads[road][segment+1][1]
        }

    };
}


function sharedPoint(
    r1,s1,
    r2,s2
){

    const a=
        getSegment(r1,s1);

    const b=
        getSegment(r2,s2);


    if(!a || !b)
        return null;


    const pointsA=[
        a.a,
        a.b
    ];

    const pointsB=[
        b.a,
        b.b
    ];


    for(const p of pointsA){

        for(const q of pointsB){

            if(
                Math.abs(p.x-q.x)<0.0001 &&
                Math.abs(p.y-q.y)<0.0001
            ){

                return{
                    x:p.x,
                    y:p.y
                };
            }
        }
    }


    return null;
}


/* =====================================================
   CONNECTED SEGMENT
===================================================== */

function findConnectedSegment(
    road,
    segment,
    point
){

    if(!currentSegment)
        return null;


    if(
        road===currentSegment.road &&
        segment===currentSegment.segment
    ){

        return null;
    }


    const corner=
        sharedPoint(
            currentSegment.road,
            currentSegment.segment,
            road,
            segment
        );


    if(!corner)
        return null;


    /*
       코너에서 95px 이내면
       회전 가능
    */

    const cornerDistance=
        Math.hypot(
            (point.x-corner.x)*W,
            (point.y-corner.y)*H
        );


    if(cornerDistance>95)
        return null;


    return{
        corner,
        road,
        segment
    };
}


/* =====================================================
   POINTER POSITION
===================================================== */

function pointerPosition(e){

    const rect=
        canvas.getBoundingClientRect();


    let clientX;
    let clientY;


    if(
        e.touches &&
        e.touches.length
    ){

        clientX=
            e.touches[0].clientX;

        clientY=
            e.touches[0].clientY;

    }else{

        clientX=e.clientX;
        clientY=e.clientY;

    }


    return{

        x:
            clientX-
            rect.left,

        y:
            clientY-
            rect.top

    };
}


/* =====================================================
   POINTER DOWN
===================================================== */

function pointerDown(e){

    e.preventDefault();


    if(
        !planning ||
        delivering ||
        pausedByEvent
    )
        return;


    const p=
        pointerPosition(e);


    const road=
        roadPoint(
            p.x,
            p.y
        );


    if(
        !road.point ||
        road.distance>90
    )
        return;


    /*
       첫 시작
    */

    if(route.length===0){

        const sx=
            startPoint.x*W;

        const sy=
            startPoint.y*H;


        if(
            Math.hypot(
                p.x-sx,
                p.y-sy
            )>95
        ){

            showTemporaryMessage(
                "출발점 근처에서 시작하세요"
            );

            return;
        }


        const key=
            segmentKey(
                road.road,
                road.segment
            );


        visitedSegments.add(key);


        route.push({
            x:startPoint.x,
            y:startPoint.y
        });


        addRoutePoint(
            road.point
        );


        routeSegments.push({
            road:road.road,
            segment:road.segment
        });


        currentSegment={
            road:road.road,
            segment:road.segment
        };


        drawing=true;


        checkDestination(
            road.point
        );


        updateAll();
        draw();

        return;
    }


    /*
       현재 경로의 끝부분
    */

    const last=
        route[route.length-1];


    const lx=
        last.x*W;

    const ly=
        last.y*H;


    /*
       현재 경로의 끝에서 멀리 떨어져 있으면
       이전 경로를 찾아본다.
    */

    if(
        Math.hypot(
            p.x-lx,
            p.y-ly
        )>95
    ){

        const oldIndex=
            findPreviousRouteSegment(
                road.road,
                road.segment
            );


        if(oldIndex>=0){

            cancelRouteFromSegment(
                oldIndex,
                road.point
            );

            drawing=true;

            updateAll();
            draw();

            return;
        }


        showTemporaryMessage(
            "현재 경로의 끝부분에서 다시 눌러주세요"
        );

        return;
    }


    /*
       같은 segment
    */

    if(
        currentSegment &&
        road.road===currentSegment.road &&
        road.segment===currentSegment.segment
    ){

        drawing=true;

        return;
    }


    /*
       새 segment
    */

    const connection=
        findConnectedSegment(
            road.road,
            road.segment,
            road.point
        );


    if(connection){

        const key=
            segmentKey(
                road.road,
                road.segment
            );


        if(
            visitedSegments.has(key)
        ){

            const oldIndex=
                findPreviousRouteSegment(
                    road.road,
                    road.segment
                );


            if(oldIndex>=0){

                cancelRouteFromSegment(
                    oldIndex,
                    road.point
                );

                drawing=true;

                updateAll();
                draw();

                return;
            }
        }


        addRoutePoint(
            connection.corner
        );


        visitedSegments.add(key);


        routeSegments.push({
            road:road.road,
            segment:road.segment
        });


        addRoutePoint(
            road.point
        );


        currentSegment={
            road:road.road,
            segment:road.segment
        };


        drawing=true;


        checkDestination(
            road.point
        );


        updateAll();
        draw();

        return;
    }


    showTemporaryMessage(
        "연결된 도로에서 계속하세요"
    );
}


/* =====================================================
   POINTER MOVE
===================================================== */

function pointerMove(e){

    e.preventDefault();


    if(
        !drawing ||
        !planning ||
        delivering ||
        pausedByEvent
    )
        return;


    const p=
        pointerPosition(e);


    const road=
        roadPoint(
            p.x,
            p.y
        );


    if(
        !road.point ||
        road.distance>90
    )
        return;


    /*
       같은 segment
    */

    if(
        currentSegment &&
        road.road===currentSegment.road &&
        road.segment===currentSegment.segment
    ){

        addRoutePoint(
            road.point
        );


        checkDestination(
            road.point
        );


        updateAll();
        draw();

        return;
    }


    /*
       ★ 이전 경로로 돌아가기
    */

    const oldIndex=
        findPreviousRouteSegment(
            road.road,
            road.segment
        );


    if(
        oldIndex>=0 &&
        (
            !currentSegment ||
            road.road!==currentSegment.road ||
            road.segment!==currentSegment.segment
        )
    ){

        cancelRouteFromSegment(
            oldIndex,
            road.point
        );


        drawing=true;


        updateAll();
        draw();

        return;
    }


    /*
       새 segment
    */

    const connection=
        findConnectedSegment(
            road.road,
            road.segment,
            road.point
        );


    if(!connection)
        return;


    const key=
        segmentKey(
            road.road,
            road.segment
        );


    if(
        visitedSegments.has(key)
    )
        return;


    /*
       ★ 코너에서는 반드시 직각으로 꺾는다.
    */

    addRoutePoint(
        connection.corner
    );


    visitedSegments.add(key);


    routeSegments.push({
        road:road.road,
        segment:road.segment
    });


    addRoutePoint(
        road.point
    );


    currentSegment={
        road:road.road,
        segment:road.segment
    };


    checkDestination(
        road.point
    );


    updateAll();
    draw();
}


/* =====================================================
   POINTER UP
===================================================== */

function pointerUp(e){

    if(e)
        e.preventDefault();


    /*
       손가락을 떼도 경로는 유지된다.
    */

    drawing=false;


    updateDeliverButton();

    draw();
}


/* =====================================================
   FIND PREVIOUS SEGMENT
===================================================== */

function findPreviousRouteSegment(
    road,
    segment
){

    for(
        let i=routeSegments.length-1;
        i>=0;
        i--
    ){

        const item=
            routeSegments[i];


        if(
            item.road===road &&
            item.segment===segment
        ){

            return i;
        }
    }


    return -1;
}


/* =====================================================
   CANCEL ROUTE
===================================================== */

function cancelRouteFromSegment(
    segmentIndex,
    point
){

    if(
        segmentIndex<0 ||
        segmentIndex>=routeSegments.length ||
        !point
    ){

        return;
    }


    /*
       선택한 segment까지 유지
    */

    routeSegments=
        routeSegments.slice(
            0,
            segmentIndex+1
        );


    /*
       경로를 안전하게 다시 만든다.
    */

    route=[
        {
            x:startPoint.x,
            y:startPoint.y
        }
    ];


    visitedSegments.clear();


    /*
       각 segment를 순서대로 연결
    */

    for(
        let i=0;
        i<routeSegments.length;
        i++
    ){

        const current=
            routeSegments[i];


        visitedSegments.add(
            segmentKey(
                current.road,
                current.segment
            )
        );


        const seg=
            getSegment(
                current.road,
                current.segment
            );


        if(!seg)
            continue;


        /*
           첫 번째 segment가 아니면
           이전 segment와 연결되는 코너를 찾는다.
        */

        if(i>0){

            const previous=
                routeSegments[i-1];


            const corner=
                sharedPoint(
                    previous.road,
                    previous.segment,
                    current.road,
                    current.segment
                );


            if(corner){

                addRoutePoint(
                    corner
                );

            }else{

                /*
                   잘못된 segment 연결이면
                   여기서 안전하게 중단
                */

                routeSegments=
                    routeSegments.slice(
                        0,
                        i
                    );

                break;
            }
        }


        /*
           마지막 segment라면
           현재 손가락 위치까지 추가
        */

        if(
            i===
            routeSegments.length-1
        ){

            const rp=
                roadPoint(
                    point.x*W,
                    point.y*H
                );


            if(
                rp &&
                rp.point &&
                rp.road===current.road &&
                rp.segment===current.segment
            ){

                addRoutePoint(
                    rp.point
                );

            }else{

                addRoutePoint(
                    seg.b
                );
            }
        }
    }


    /*
       현재 segment 갱신
    */

    if(
        routeSegments.length>0
    ){

        const last=
            routeSegments[
                routeSegments.length-1
            ];


        currentSegment={
            road:last.road,
            segment:last.segment
        };

    }else{

        currentSegment=null;
    }


    routeDistance=
        calculateRouteDistance();


    /*
       배송지 판정 다시 계산
    */

    deliveredCargo.clear();


    for(
        const p of route
    ){

        checkDestination(p);

    }


    showTemporaryMessage(
        "↶ 경로를 되돌렸습니다"
    );
}


/* =====================================================
   ROUTE DISTANCE
===================================================== */

function calculateRouteDistance(){

    let total=0;


    for(
        let i=1;
        i<route.length;
        i++
    ){

        total+=
            Math.hypot(
                (
                    route[i].x-
                    route[i-1].x
                )*W,

                (
                    route[i].y-
                    route[i-1].y
                )*H
            );

    }


    return total;
}


/* =====================================================
   ADD ROUTE POINT
===================================================== */

function addRoutePoint(point){

    if(!point)
        return;


    const last=
        route[route.length-1];


    if(!last){

        route.push({
            x:point.x,
            y:point.y
        });

        return;
    }


    const dx=
        (point.x-last.x)*W;

    const dy=
        (point.y-last.y)*H;


    const distance=
        Math.hypot(
            dx,
            dy
        );


    if(distance<3)
        return;


    routeDistance+=distance;


    route.push({
        x:point.x,
        y:point.y
    });
}


/* =====================================================
   DESTINATION
===================================================== */

function checkDestination(point){

    if(!point)
        return;


    for(
        const item of cargoData
    ){

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            continue;


        if(
            deliveredCargo.has(
                item.id
            )
        )
            continue;


        const d=
            Math.hypot(
                point.x-item.x,
                point.y-item.y
            );


        if(d<.065){

            deliveredCargo.add(
                item.id
            );
        }
    }
}


/* =====================================================
   CLEAR
===================================================== */

function clearRoute(){

    if(!planning)
        return;


    route=[];
    routeDistance=0;

    deliveredCargo.clear();

    visitedSegments.clear();
    triggeredEvents.clear();

    routeSegments=[];

    currentSegment=null;

    drawing=false;


    modeMessage.textContent=

   UPDATE

    updateCargoHud();

/* =====================================================
   START DELIVERY
===================================================== */

function startDelivery(){

    if(
        !planning ||
        delivering
    )
        return;


    if(
        deliveredCargo.size!==
        selectedCargo.length
    )
        return;


    planning=false;
    delivering=true;
    pausedByEvent=false;


    damage=0;

    deliveryProgress=0;

    deliveryStart=
        performance.now();

    deliveryElapsed=0;


    deliveredCargo.clear();


    clearButton.disabled=true;
    deliverButton.disabled=true;


    modeMessage.textContent=
        "계획한 경로를 따라 배송 중";


    deliveryStatus.style.display=
        "block";


    updateCargoHud();


    deliveryLoop.lastTime=null;


    requestAnimationFrame(
        deliveryLoop
    );
}


/* =====================================================
   DELIVERY LOOP
===================================================== */

function deliveryLoop(now){

    if(!delivering)
        return;


    /*
       이벤트 팝업이 떠 있으면
       캐릭터가 움직이지 않는다.
    */

    if(pausedByEvent){

        deliveryLoop.lastTime=now;

        requestAnimationFrame(
            deliveryLoop
        );

        return;
    }


    if(
        deliveryLoop.lastTime===null
    ){

        deliveryLoop.lastTime=now;
    }


    const dt=
        Math.min(
            .05,
            (
                now-
                deliveryLoop.lastTime
            )/1000
        );


    deliveryLoop.lastTime=now;


    deliveryElapsed=
        (
            now-
            deliveryStart
        )/1000;


    /*
       배송 속도
    */

    const speed=500;


    let remaining=
        speed*dt;


    while(
        remaining>0 &&
        deliveryProgress<
        route.length-1
    ){

        const index=
            Math.floor(
                deliveryProgress
            );


        const fraction=
            deliveryProgress-index;


        const a=
            route[index];

        const b=
            route[index+1];


        const segmentLength=
            Math.hypot(
                (
                    b.x-a.x
                )*W,

                (
                    b.y-a.y
                )*H
            );


        if(segmentLength<=0){

            deliveryProgress=
                index+1;

            continue;
        }


        const remainingOnSegment=
            segmentLength*
            (1-fraction);


        if(
            remaining<
            remainingOnSegment
        ){

            deliveryProgress+=
                remaining/
                segmentLength;

            remaining=0;

        }else{

            remaining-=
                remainingOnSegment;

            deliveryProgress=
                index+1;
        }
    }


    checkDeliveryDestinations();


    const rate=
        getDamageRate();


    damage+=
        speed*
        dt*
        .002*
        rate;


    damage=
        Math.min(
            100,
            damage
        );


    checkEvent();


    updateHUD();
    updateCargoHud();


    drawDelivery();


    if(
        deliveryProgress>=
        route.length-1
    ){

        finishDelivery();

        return;
    }


    requestAnimationFrame(
        deliveryLoop
    );
}


/* =====================================================
   DELIVERY POSITION
===================================================== */

function getDeliveryPosition(){

    if(
        route.length===0
    )
        return startPoint;


    const index=
        Math.floor(
            deliveryProgress
        );


    if(
        index>=route.length-1
    ){

        return route[
            route.length-1
        ];
    }


    const fraction=
        deliveryProgress-index;


    const a=
        route[index];

    const b=
        route[index+1];


    return{

        x:
            a.x+
            (
                b.x-a.x
            )*fraction,

        y:
            a.y+
            (
                b.y-a.y
            )*fraction

    };
}


/* =====================================================
   DELIVERY DESTINATIONS
===================================================== */

function checkDeliveryDestinations(){

    const p=
        getDeliveryPosition();


    for(
        const item of cargoData
    ){

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            continue;


        if(
            deliveredCargo.has(
                item.id
            )
        )
            continue;


        const d=
            Math.hypot(
                p.x-item.x,
                p.y-item.y
            );


        if(d<.065){

            deliveredCargo.add(
                item.id
            );
        }
    }
}


/* =====================================================
   DAMAGE
===================================================== */

function getDamageRate(){

    let total=0;
    let count=0;


    for(
        const id of selectedCargo
    ){

        const item=
            cargoData.find(
                x=>x.id===id
            );


        if(item){

            total+=item.damageRate;

            count++;
        }
    }


    return count
        ? total/count
        : 1;
}


/* =====================================================
   EVENT
===================================================== */

function checkEvent(){

    if(
        triggeredEvents.has(
            "center"
        )
    )
        return;


    const p=
        getDeliveryPosition();


    if(
        Math.hypot(
            p.x-.50,
            p.y-.50
        )<.035
    ){

        triggeredEvents.add(
            "center"
        );


        damage+=5;


        /*
           ★ 캐릭터 정지
        */

        pausedByEvent=true;


        showEvent(
            "⚡ ELECTROMAGNETIC STORM",

            "도시 중앙을 지나던 중 강한<br>"+
            "전자기 폭풍이 발생했습니다.<br><br>"+
            "배송품 손상도 +5%"
        );
    }
}


function showEvent(
    title,
    text
){

    eventTitle.textContent=
        title;


    eventText.innerHTML=
        text;


    eventBox.style.display=
        "block";
}


function closeEvent(){

    eventBox.style.display=
        "none";


    /*
       ★ 확인 버튼을 눌러야
       배송 재개
    */

    pausedByEvent=false;


    deliveryLoop.lastTime=
        performance.now();


    if(delivering){

        requestAnimationFrame(
            deliveryLoop
        );
    }
}


/* =====================================================
   FINISH
===================================================== */

function finishDelivery(){

    delivering=false;
    pausedByEvent=false;


    deliveryLoop.lastTime=null;


    deliveryStatus.style.display=
        "none";


    damage=
        Math.min(
            100,
            damage
        );


    const ideal=
        getIdealDistance();


    const efficiency=
        Math.max(
            0,
            Math.min(
                100,

                100-
                Math.max(
                    0,
                    routeDistance-
                    ideal
                )/8
            )
        );


    let reward=0;


    for(
        const id of selectedCargo
    ){

        const item=
            cargoData.find(
                x=>x.id===id
            );


        if(item)
            reward+=item.reward;
    }


    reward*=
        Math.max(
            .2,
            1-damage/100
        );


    reward*=
        efficiency/100;


    const score=
        efficiency*.55+
        (100-damage)*.45;


    let grade="D";


    if(score>=92)
        grade="S";

    else if(score>=82)
        grade="A";

    else if(score>=68)
        grade="B";

    else if(score>=52)
        grade="C";


    $("resultDistance").textContent=
        Math.round(routeDistance)+"m";


    $("resultTime").textContent=
        deliveryElapsed.toFixed(1)+"s";


    $("resultDamage").textContent=
        damage.toFixed(1)+"%";


    $("resultEfficiency").textContent=
        Math.round(efficiency)+"%";


    $("resultReward").textContent=
        "¥ "+
        Math.round(
            reward
        ).toLocaleString();


    $("grade").textContent=
        grade;


    showScreen(resultScreen);
}

   IDEAL DISTANCE
===================================================== */

function getIdealDistance(){

    return(
        750+
        selectedCargo.length*90
    );
}

   TEMPORARY MESSAGE
===================================================== */

let messageTimer=null;

    clearTimeout(
        messageTimer
    );


    messageTimer=

            ()=>{

                if(planning){

/* =====================================================
   DRAW MAP
===================================================== */

function draw(){

    if(!W || !H)
        return;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       BACKGROUND
    */

    ctx.fillStyle="#070910";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       CITY BLOCKS
    */

    for(
        let x=0;
        x<W;
        x+=42
    ){

        for(
            let y=0;
            y<H;
            y+=42
        ){

            const roadX=
                Math.min(
                    Math.abs(x/W-.20),
                    Math.abs(x/W-.50),
                    Math.abs(x/W-.80)
                )<.07;


            const roadY=
                Math.min(
                    Math.abs(y/H-.20),
                    Math.abs(y/H-.50),
                    Math.abs(y/H-.80)
                )<.07;


            if(
                roadX||
                roadY
            )
                continue;


            ctx.fillStyle=
                (
                    (x+y)/42
                )%2===0
                ? "#111521"
                : "#0d111a";


            ctx.fillRect(
                x+2,
                y+2,
                36,
                36
            );
        }
    }


    /*
       ROADS
    */

    for(
        const path of roads
    ){

        ctx.beginPath();


        for(
            let i=0;
            i<path.length;
            i++
        ){

            const x=
                path[i][0]*W;

            const y=
                path[i][1]*H;


            if(i===0)
                ctx.moveTo(x,y);

            else
                ctx.lineTo(x,y);

        }


        ctx.lineWidth=31;

        ctx.strokeStyle="#252a36";

        ctx.stroke();


        ctx.lineWidth=2;

        ctx.strokeStyle="#4a5060";

        ctx.stroke();


        ctx.setLineDash(
            [8,9]
        );


        ctx.lineWidth=1;

        ctx.strokeStyle=
            "rgba(130,140,155,.35)";

        ctx.stroke();


        ctx.setLineDash([]);
    }


    /*
       EVENT MARKER
    */

    ctx.fillStyle="#ffcf55";

    ctx.shadowColor="#ffcf55";

    ctx.shadowBlur=10;


    ctx.beginPath();

    ctx.arc(
        W*.50,
        H*.50,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    /*
       DESTINATIONS
    */

    for(
        const item of cargoData
    ){

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            continue;


        const x=
            item.x*W;

        const y=
            item.y*H;


        const done=
            deliveredCargo.has(
                item.id
            );


        ctx.strokeStyle=
            done
            ? "#5cff9a"
            : "#ffcf55";


        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            17,
            0,
            Math.PI*2
        );

        ctx.stroke();


        ctx.fillStyle=
            done
            ? "#5cff9a"
            : "#ffcf55";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#080910";

        ctx.font=
            "bold 10px Arial";

        ctx.textAlign="center";

        ctx.textBaseline="middle";


        ctx.fillText(
            done?"✓":"!",
            x,
            y
        );
    }


    /*
       ★ ROUTE
       lineJoin을 miter로 설정하여
       삼각형처럼 둥글게 튀어나오는 것을 방지
    */

    if(
        route.length>1
    ){

        ctx.save();


        ctx.beginPath();


        for(
            let i=0;
            i<route.length;
            i++
        ){

            const x=
                route[i].x*W;

            const y=
                route[i].y*H;


            if(i===0)
                ctx.moveTo(x,y);

            else
                ctx.lineTo(x,y);
        }


        ctx.lineJoin="miter";
        ctx.lineCap="square";


        /*
           glow
        */

        ctx.lineWidth=12;

        ctx.strokeStyle=
            delivering
            ? "rgba(255,60,145,.18)"
            : "rgba(99,245,255,.20)";


        ctx.stroke();


        /*
           main line
        */

        ctx.lineWidth=5;

        ctx.strokeStyle=
            delivering
            ? "#ff3c91"
            : "#63f5ff";


        ctx.shadowColor=
            delivering
            ? "#ff3c91"
            : "#63f5ff";


        ctx.shadowBlur=10;


        ctx.stroke();


        ctx.restore();
    }


    /*
       START
    */

    const sx=
        startPoint.x*W;

    const sy=
        startPoint.y*H;


    ctx.fillStyle="#63f5ff";

    ctx.shadowColor="#63f5ff";

    ctx.shadowBlur=12;


    ctx.beginPath();

    ctx.arc(
        sx,
        sy,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.fillStyle="#071016";

    ctx.font=
        "bold 10px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    ctx.fillText(
        "S",
        sx,
        sy
    );


    /*
       START HIGHLIGHT
    */

    if(
        planning &&
        route.length===0
    ){

        ctx.strokeStyle=
            "rgba(99,245,255,.35)";

        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            23,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    /*
       CURRENT END
    */

    if(
        planning &&
        route.length>1
    ){

        const last=
            route[
                route.length-1
            ];


        ctx.fillStyle="#fff";

        ctx.shadowColor="#63f5ff";

        ctx.shadowBlur=12;


        ctx.beginPath();

        ctx.arc(
            last.x*W,
            last.y*H,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.shadowBlur=0;
    }
}


/* =====================================================
   DELIVERY DRAW
===================================================== */

function drawDelivery(){

    draw();


    const p=
        getDeliveryPosition();


    ctx.save();


    ctx.shadowColor="#ff3c91";

    ctx.shadowBlur=20;

    ctx.fillStyle="#ff3c91";


    ctx.beginPath();

    ctx.arc(
        p.x*W,
        p.y*H,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.fillStyle="#fff";


    ctx.beginPath();

    ctx.arc(
        p.x*W+5,
        p.y*H-4,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}

canvas.addEventListener(

    {passive:false}
);

canvas.addEventListener(
    "pointercancel",
    pointerUp,
    {passive:false}

resize();

</script>
