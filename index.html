<html lang="ko">

<title>CYBER DELIVERY</title>

<style>

*{

html,body{

    padding:0;

    height:100%;

button{

.screen{

/* =====================================================
   TITLE
===================================================== */

.title-city::before,

.title-city::after{

.start-button{

    color:#63f5ff;

}

.version{

/* =====================================================
   CARGO
===================================================== */

.cargo-card{

.cargo-card.selected{

.cargo-icon{

.cargo-name{

}

.cargo-destination{

    color:#777f8e;

    font-size:9px;
}

.cargo-reward{
    margin-top:9px;

}

.check{

    right:8px;

    height:19px;

}

.cargo-card.selected .check{

}

.cargo-footer{

.selected-count{

/* =====================================================

<script>

    },

    {

    {

    {

    {

        reward:5000
    }

];

let selectedCargo=[];


/* =====================================================
   SCREEN
===================================================== */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}


/* =====================================================
   CARGO
===================================================== */

function showCargoScreen(){

    showScreen("cargoScreen");

    renderCargo();
}


function renderCargo(){

    const grid=
        document.getElementById(
            "cargoGrid"
        );

    grid.innerHTML="";


    cargoData.forEach(item=>{

        const card=
            document.createElement("div");

        card.className="cargo-card";


        if(
            selectedCargo.includes(
                item.id
            )
        ){

            card.classList.add(
                "selected"
            );
        }


        card.innerHTML=`

            <div class="check">✓</div>

            <div class="cargo-icon">
                ${item.icon}
            </div>

            <div class="cargo-name">
                ${item.name}
            </div>

            <div class="cargo-destination">
                → ${item.destination}
            </div>

            <div class="cargo-reward">
                ¥${item.reward.toLocaleString()}
            </div>

        `;


        card.addEventListener(
            "click",
            ()=>toggleCargo(item.id)
        );


        grid.appendChild(card);

    });


    updateCargoSelection();
}


function toggleCargo(id){

    const index=
        selectedCargo.indexOf(id);


    if(index>=0){

        selectedCargo.splice(
            index,
            1
        );

    }else{

        selectedCargo.push(id);

    }


    renderCargo();
}


function updateCargoSelection(){

    document.getElementById(
        "selectedCount"
    ).textContent=
        "선택된 물품: "+
        selectedCargo.length+
        "개";


    document.getElementById(
        "cargoStart"
    ).disabled=
        selectedCargo.length===0;
}


/* =====================================================
   MAP
===================================================== */

const roads=[

    [
        [.08,.20],
        [.20,.20],
        [.35,.20],
        [.50,.20],
        [.65,.20],
        [.80,.20],
        [.92,.20]
    ],

    [
        [.08,.50],
        [.20,.50],
        [.35,.50],
        [.50,.50],
        [.65,.50],
        [.80,.50],
        [.92,.50]
    ],

    [

        [.20,.80],
        [.35,.80],
        [.50,.80],
        [.65,.80],
        [.80,.80],
        [.92,.80]
    ],

    [
        [.20,.08],
        [.20,.20],
        [.20,.50],
        [.20,.80],
        [.20,.92]
    ],

    [
        [.50,.08],
        [.50,.20],
        [.50,.50],
        [.50,.80],
        [.50,.92]
    ],

    [
        [.80,.08],
        [.80,.20],
        [.80,.50],
        [.80,.80],
        [.80,.92]
    ]

];


const startPoint={
    x:.08,
    y:.50
};


/* =====================================================
   STATE
===================================================== */

let route=[];

let routeDistance=0;

let drawing=false;

let planning=false;

let delivering=false;

let deliveryProgress=0;

let deliveryStart=0;

let deliveryElapsed=0;

let damage=0;

let deliveredCargo=new Set();

let visitedSegments=new Set();

let triggeredEvents=new Set();

let W=0;

let H=0;


/*
    현재 손가락이 잡고 있는 segment.
    손가락을 떼어도 유지된다.
*/

let currentSegment=null;


/* =====================================================
   CANVAS
===================================================== */

const canvas=
    document.getElementById(
        "gameCanvas"
    );

const ctx=
    canvas.getContext("2d");


function resize(){

    const dpr=
        Math.min(
            window.devicePixelRatio||1,
            2
        );


    W=window.innerWidth;

    H=window.innerHeight;


    canvas.width=W*dpr;
    canvas.height=H*dpr;


    canvas.style.width=
        W+"px";

    canvas.style.height=
        H+"px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    draw();
}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   START GAME
===================================================== */

function startRoutePlanning(){

    showScreen("gameScreen");


    planning=true;

    delivering=false;

    drawing=false;


    route=[];

    routeDistance=0;

    damage=0;


    deliveredCargo.clear();

    visitedSegments.clear();

    triggeredEvents.clear();


    currentSegment=null;


    document.getElementById(
        "modeMessage"
    ).textContent=
        "출발점에서 손가락을 누르고 도로를 따라 경로를 그리세요";


    document.getElementById(
        "deliveryStatus"
    ).style.display="none";


    document.getElementById(
        "clearButton"
    ).disabled=false;


    updateCargoHud();

    updateHUD();

    updateDeliverButton();

    resize();

    draw();
}


/* =====================================================
   ROAD SNAP
===================================================== */

function roadPoint(x,y){

    let best=null;

    let bestDistance=Infinity;

    let bestRoad=-1;

    let bestSegment=-1;


    for(
        let r=0;
        r<roads.length;
        r++
    ){

        const road=roads[r];


        for(
            let s=0;
            s<road.length-1;
            s++
        ){

            const a={
                x:road[s][0]*W,
                y:road[s][1]*H
            };


            const b={
                x:road[s+1][0]*W,
                y:road[s+1][1]*H
            };


            const dx=b.x-a.x;

            const dy=b.y-a.y;


            const len2=
                dx*dx+
                dy*dy;


            let t=
                (
                    (x-a.x)*dx+
                    (y-a.y)*dy
                )/len2;


            t=
                Math.max(
                    0,
                    Math.min(
                        1,
                        t
                    )
                );


            const px=
                a.x+
                dx*t;

            const py=
                a.y+
                dy*t;


            const d=
                Math.hypot(
                    x-px,
                    y-py
                );


            if(d<bestDistance){

                bestDistance=d;

                best={
                    x:px/W,
                    y:py/H
                };

                bestRoad=r;

                bestSegment=s;
            }
        }
    }


    return{
        point:best,
        distance:bestDistance,
        road:bestRoad,
        segment:bestSegment
    };
}


/* =====================================================
   SEGMENT
===================================================== */

function segmentKey(
    road,
    segment
){

    return road+"_"+segment;
}


function getSegment(
    road,
    segment
){

    return{

        a:{
            x:roads[road][segment][0],
            y:roads[road][segment][1]
        },

        b:{
            x:roads[road][segment+1][0],
            y:roads[road][segment+1][1]
        }

    };
}


function sharedPoint(
    r1,s1,
    r2,s2
){

    const a=
        getSegment(r1,s1);

    const b=
        getSegment(r2,s2);


    const pointsA=[
        a.a,
        a.b
    ];

    const pointsB=[
        b.a,
        b.b
    ];


    for(
        const p of pointsA
    ){

        for(
            const q of pointsB
        ){

            if(
                Math.abs(
                    p.x-q.x
                )<0.0001
                &&
                Math.abs(
                    p.y-q.y
                )<0.0001
            ){

                return{
                    x:p.x,
                    y:p.y
                };
            }
        }
    }


    return null;
}


/* =====================================================
   POINTER POSITION
===================================================== */

function pointerPosition(e){

    const rect=
        canvas.getBoundingClientRect();


    let clientX;
    let clientY;


    if(
        e.touches &&
        e.touches.length
    ){

        clientX=
            e.touches[0].clientX;

        clientY=
            e.touches[0].clientY;

    }else{

        clientX=e.clientX;
        clientY=e.clientY;

    }


    return{

        x:
            clientX-
            rect.left,

        y:
            clientY-
            rect.top

    };
}


/* =====================================================
   POINTER DOWN
===================================================== */

function pointerDown(e){

    e.preventDefault();


    if(
        !planning ||
        delivering
    )
        return;


    const p=
        pointerPosition(e);


    const road=
        roadPoint(
            p.x,
            p.y
        );


    if(
        !road.point ||
        road.distance>80
    ){

        return;
    }


    /*
       ★ 첫 번째 터치
    */

    if(route.length===0){

        const sx=
            startPoint.x*W;

        const sy=
            startPoint.y*H;


        if(
            Math.hypot(
                p.x-sx,
                p.y-sy
            )>85
        ){

            showTemporaryMessage(
                "출발점 근처에서 시작하세요"
            );

            return;
        }


        const key=
            segmentKey(
                road.road,
                road.segment
            );


        visitedSegments.add(
            key
        );


        route.push({
            x:startPoint.x,
            y:startPoint.y
        });


        /*
           첫 segment의 현재 위치를
           출발점부터 연결한다.
        */

        route.push(
            road.point
        );


        routeDistance=
            Math.hypot(
                (
                    road.point.x-
                    startPoint.x
                )*W,

                (
                    road.point.y-
                    startPoint.y
                )*H
            );


        currentSegment={
            road:road.road,
            segment:road.segment
        };


        drawing=true;


        checkDestination(
            road.point
        );


        updateHUD();
        updateCargoHud();
        updateDeliverButton();

        draw();

        return;
    }


    /*
       ★ 이미 경로가 존재하는 경우

       다시 누르면 "현재 경로 끝점"에서
       계속 이어진다.

       출발점으로 돌아가지 않는다.
    */

    const last=
        route[
            route.length-1
        ];


    const lx=
        last.x*W;

    const ly=
        last.y*H;


    /*
       손가락을 현재 경로 끝점 근처에서
       다시 눌러야 한다.

       모바일을 고려해 85px 허용.
    */

    if(
        Math.hypot(
            p.x-lx,
            p.y-ly
        )>85
    ){

        showTemporaryMessage(
            "현재 경로의 끝부분에서 다시 눌러주세요"
        );

        return;
    }


    /*
       현재 끝점이 속한 segment에서
       다시 시작하는 경우.
    */

    if(
        currentSegment &&
        road.road===
        currentSegment.road &&
        road.segment===
        currentSegment.segment
    ){

        drawing=true;

        return;
    }


    /*
       새로운 segment로 이어지는지 확인.
    */

    if(currentSegment){

        const corner=
            sharedPoint(
                currentSegment.road,
                currentSegment.segment,

                road.road,
                road.segment
            );


        /*
           이어지지 않는 도로라면 무시.
        */

        if(!corner){

            showTemporaryMessage(
                "연결된 도로에서 계속하세요"
            );

            return;
        }


        const newKey=
            segmentKey(
                road.road,
                road.segment
            );


        /*
           이미 사용한 segment면 금지.
        */

        if(
            visitedSegments.has(
                newKey
            )
        ){

            showTemporaryMessage(
                "⚠ 이미 지나간 도로입니다!"
            );

            return;
        }


        /*
           ★ 직각 연결

           마지막 위치
              ↓
           교차점
              ↓
           새로운 도로
        */

        addRoutePoint(
            corner
        );


        visitedSegments.add(
            newKey
        );


        addRoutePoint(
            road.point
        );


        currentSegment={
            road:road.road,
            segment:road.segment
        };


        drawing=true;


        checkDestination(
            road.point
        );


        updateHUD();
        updateCargoHud();
        updateDeliverButton();

        draw();
    }
}


/* =====================================================
   POINTER MOVE
===================================================== */

function pointerMove(e){

    e.preventDefault();


    if(
        !drawing ||
        !planning ||
        delivering
    )
        return;


    const p=
        pointerPosition(e);


    const road=
        roadPoint(
            p.x,
            p.y
        );


    /*
       ★ 판정 범위를 넓게
    */

    if(
        !road.point ||
        road.distance>80
    ){

        return;
    }


    /*
       현재 segment와 같은 경우
       자유롭게 이동.
    */

    if(
        currentSegment &&
        road.road===
        currentSegment.road &&
        road.segment===
        currentSegment.segment
    ){

        addRoutePoint(
            road.point
        );


        checkDestination(
            road.point
        );


        updateHUD();
        updateCargoHud();
        updateDeliverButton();

        draw();

        return;
    }


    /*
       새로운 segment
    */

    const newKey=
        segmentKey(
            road.road,
            road.segment
        );


    /*
       이미 사용한 도로는 금지.
    */

    if(
        visitedSegments.has(
            newKey
        )
    ){

        drawing=false;


        showTemporaryMessage(
            "⚠ 이미 지나간 도로입니다!"
        );


        return;
    }


    /*
       현재 segment와 연결되는지 확인.
    */

    if(currentSegment){

        const corner=
            sharedPoint(
                currentSegment.road,
                currentSegment.segment,

                road.road,
                road.segment
            );


        /*
           연결되지 않은 곳으로
           손가락이 순간이동한 경우 무시.
        */

        if(!corner){

            return;
        }


        /*
           직각 코너 추가
        */

        addRoutePoint(
            corner
        );


        visitedSegments.add(
            newKey
        );


        addRoutePoint(
            road.point
        );


        currentSegment={
            road:road.road,
            segment:road.segment
        };

    }


    checkDestination(
        road.point
    );


    updateHUD();
    updateCargoHud();
    updateDeliverButton();

    draw();
}


/* =====================================================
   ADD ROUTE POINT
===================================================== */

function addRoutePoint(point){

    if(!point)
        return;


    const last=
        route[
            route.length-1
        ];


    if(!last){

        route.push({
            x:point.x,
            y:point.y
        });

        return;
    }


    const dx=
        (point.x-last.x)*W;

    const dy=
        (point.y-last.y)*H;


    const distance=
        Math.hypot(
            dx,
            dy
        );


    if(distance<2)
        return;


    routeDistance+=distance;


    route.push({
        x:point.x,
        y:point.y
    });
}


/* =====================================================
   POINTER UP
===================================================== */

function pointerUp(e){

    if(e)
        e.preventDefault();


    /*
       ★ 중요

       여기서는 route를 절대로 지우지 않는다.

       손가락을 떼어도 현재 경로는 그대로 유지되고,
       다음 pointerDown에서 현재 끝점부터 이어진다.
    */

    drawing=false;


    updateDeliverButton();

    draw();
}


/* =====================================================
   TEMP MESSAGE
===================================================== */

function showTemporaryMessage(
    message
){

    document.getElementById(
        "modeMessage"
    ).textContent=message;


    setTimeout(()=>{

        if(planning){

            document.getElementById(
                "modeMessage"
            ).textContent=
                "경로 끝부분에서 다시 눌러 계속 이어갈 수 있습니다";

        }

    },1300);
}


/* =====================================================
   DESTINATION
===================================================== */

function checkDestination(point){

    cargoData.forEach(item=>{

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            return;


        if(
            deliveredCargo.has(
                item.id
            )
        )
            return;


        const d=
            Math.hypot(
                point.x-item.x,
                point.y-item.y
            );


        if(d<.065){

            deliveredCargo.add(
                item.id
            );

        }

    });
}


/* =====================================================
   CLEAR
===================================================== */

function clearRoute(){

    if(!planning)
        return;


    route=[];

    routeDistance=0;

    deliveredCargo.clear();

    visitedSegments.clear();

    triggeredEvents.clear();

    currentSegment=null;

    drawing=false;


    document.getElementById(
        "modeMessage"
    ).textContent=
        "출발점에서 손가락을 누르고 도로를 따라 경로를 그리세요";


    updateHUD();
    updateCargoHud();
    updateDeliverButton();

    draw();
}


/* =====================================================
   DELIVER BUTTON
===================================================== */

function updateDeliverButton(){

    const button=
        document.getElementById(
            "deliverButton"
        );


    const complete=
        selectedCargo.length>0 &&
        deliveredCargo.size===
        selectedCargo.length;


    button.disabled=
        !complete ||
        route.length<2 ||
        delivering;
}


/* =====================================================
   START DELIVERY
===================================================== */

function startDelivery(){

    if(
        !planning ||
        delivering
    )
        return;


    if(
        deliveredCargo.size!==
        selectedCargo.length
    )
        return;


    planning=false;

    delivering=true;

    damage=0;

    deliveryProgress=0;

    deliveryStart=
        performance.now();

    deliveryElapsed=0;


    deliveredCargo.clear();


    document.getElementById(
        "clearButton"
    ).disabled=true;


    document.getElementById(
        "deliverButton"
    ).disabled=true;


    document.getElementById(
        "modeMessage"
    ).textContent=
        "계획한 경로를 따라 배송 중";


    document.getElementById(
        "deliveryStatus"
    ).style.display=
        "block";


    updateCargoHud();


    deliveryLoop.lastTime=null;


    requestAnimationFrame(
        deliveryLoop
    );
}


/* =====================================================
   DELIVERY
===================================================== */

function deliveryLoop(now){

    if(!delivering)
        return;


    deliveryElapsed=
        (
            now-
            deliveryStart
        )/1000;


    const speed=500;


    const dt=
        Math.min(
            .05,
            (
                now-
                (
                    deliveryLoop.lastTime||
                    now
                )
            )/1000
        );


    deliveryLoop.lastTime=now;


    let remaining=
        speed*dt;


    while(
        remaining>0 &&
        deliveryProgress<
        route.length-1
    ){

        const index=
            Math.floor(
                deliveryProgress
            );


        const fraction=
            deliveryProgress-index;


        const a=
            route[index];

        const b=
            route[index+1];


        const segmentLength=
            Math.hypot(
                (
                    b.x-a.x
                )*W,

                (
                    b.y-a.y
                )*H
            );


        const remainingOnSegment=
            segmentLength*
            (1-fraction);


        if(
            remaining<
            remainingOnSegment
        ){

            deliveryProgress+=
                remaining/
                segmentLength;

            remaining=0;

        }else{

            remaining-=
                remainingOnSegment;

            deliveryProgress=
                index+1;
        }

    }


    checkDeliveryDestinations();


    const rate=
        getDamageRate();


    damage+=
        speed*
        dt*
        .002*
        rate;


    damage=
        Math.min(
            100,
            damage
        );


    checkEvent();


    updateHUD();
    updateCargoHud();

    drawDelivery();


    if(
        deliveryProgress>=
        route.length-1
    ){

        finishDelivery();

        return;
    }


    requestAnimationFrame(
        deliveryLoop
    );
}


/* =====================================================
   DELIVERY POSITION
===================================================== */

function getDeliveryPosition(){

    if(
        route.length===0
    )
        return startPoint;


    const index=
        Math.floor(
            deliveryProgress
        );


    if(
        index>=route.length-1
    ){

        return route[
            route.length-1
        ];
    }


    const fraction=
        deliveryProgress-
        index;


    const a=
        route[index];

    const b=
        route[index+1];


    return{

        x:
            a.x+
            (
                b.x-a.x
            )*fraction,

        y:
            a.y+
            (
                b.y-a.y
            )*fraction

    };
}


/* =====================================================
   DELIVERY DESTINATION
===================================================== */

function checkDeliveryDestinations(){

    const p=
        getDeliveryPosition();


    cargoData.forEach(item=>{

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            return;


        if(
            deliveredCargo.has(
                item.id
            )
        )
            return;


        const d=
            Math.hypot(
                p.x-item.x,
                p.y-item.y
            );


        if(d<.065){

            deliveredCargo.add(
                item.id
            );
        }

    });
}


/* =====================================================
   DAMAGE
===================================================== */

function getDamageRate(){

    let total=0;

    let count=0;


    selectedCargo.forEach(id=>{

        const item=
            cargoData.find(
                x=>x.id===id
            );


        if(item){

            total+=
                item.damageRate;

            count++;
        }

    });


    return count
        ? total/count
        : 1;
}


/* =====================================================
   EVENT
===================================================== */

function checkEvent(){

    if(
        triggeredEvents.has(
            "center"
        )
    )
        return;


    const p=
        getDeliveryPosition();


    if(
        Math.hypot(
            p.x-.50,
            p.y-.50
        )<.035
    ){

        triggeredEvents.add(
            "center"
        );


        damage+=5;


        showEvent(
            "⚡ ELECTROMAGNETIC STORM",

            "도시 중앙을 지나던 중 강한<br>"+
            "전자기 폭풍이 발생했습니다.<br><br>"+
            "배송품 손상도 +5%"
        );
    }
}


function showEvent(
    title,
    text
){

    document.getElementById(
        "eventTitle"
    ).textContent=
        title;


    document.getElementById(
        "eventText"
    ).innerHTML=
        text;


    document.getElementById(
        "event"
    ).style.display=
        "block";
}


function closeEvent(){

    document.getElementById(
        "event"
    ).style.display=
        "none";
}


/* =====================================================
   FINISH
===================================================== */

function finishDelivery(){

    delivering=false;


    deliveryLoop.lastTime=
        null;


    document.getElementById(
        "deliveryStatus"
    ).style.display=
        "none";


    damage=
        Math.min(
            100,
            damage
        );


    const ideal=
        getIdealDistance();


    const efficiency=
        Math.max(
            0,
            Math.min(
                100,

                100-
                Math.max(
                    0,
                    routeDistance-
                    ideal
                )/8
            )
        );


    let reward=0;


    selectedCargo.forEach(id=>{

        const item=
            cargoData.find(
                x=>x.id===id
            );


        if(item)
            reward+=item.reward;

    });


    reward*=
        Math.max(
            .2,
            1-damage/100
        );


    reward*=
        efficiency/100;


    const score=
        efficiency*.55+
        (100-damage)*.45;


    let grade="D";


    if(score>=92)
        grade="S";

    else if(score>=82)
        grade="A";

    else if(score>=68)
        grade="B";

    else if(score>=52)
        grade="C";


    document.getElementById(
        "resultDistance"
    ).textContent=
        Math.round(
            routeDistance
        )+"m";


    document.getElementById(
        "resultTime"
    ).textContent=
        deliveryElapsed.toFixed(1)+
        "s";


    document.getElementById(
        "resultDamage"
    ).textContent=
        damage.toFixed(1)+
        "%";


    document.getElementById(
        "resultEfficiency"
    ).textContent=
        Math.round(
            efficiency
        )+
        "%";


    document.getElementById(
        "resultReward"
    ).textContent=
        "¥ "+
        Math.round(
            reward
        ).toLocaleString();


    document.getElementById(
        "grade"
    ).textContent=
        grade;


    showScreen(
        "resultScreen"
    );
}


/* =====================================================
   IDEAL DISTANCE
===================================================== */

function getIdealDistance(){

    return(
        750+
        selectedCargo.length*90
    );
}

   HUD

   CARGO HUD
===================================================== */

function updateCargoHud(){

        document.getElementById(
            "cargoHud"
        );

        `;

/* =====================================================
   DRAW
===================================================== */

function draw(){

    if(!W || !H)
        return;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle="#070910";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* CITY */

    for(
        let x=0;
        x<W;
        x+=42
    ){

        for(
            let y=0;
            y<H;
            y+=42
        ){

            const roadX=
                Math.min(
                    Math.abs(
                        x/W-.20
                    ),

                    Math.abs(
                        x/W-.50
                    ),

                    Math.abs(
                        x/W-.80
                    )
                )<.07;


            const roadY=
                Math.min(
                    Math.abs(
                        y/H-.20
                    ),

                    Math.abs(
                        y/H-.50
                    ),

                    Math.abs(
                        y/H-.80
                    )
                )<.07;


            if(
                roadX ||
                roadY
            )
                continue;


            ctx.fillStyle=
                (
                    (x+y)/42
                )%2===0
                ? "#111521"
                : "#0d111a";


            ctx.fillRect(
                x+2,
                y+2,
                36,
                36
            );
        }
    }


    /* ROADS */

    roads.forEach(path=>{

        ctx.beginPath();


        path.forEach(
            (point,index)=>{

                const x=
                    point[0]*W;

                const y=
                    point[1]*H;


                if(index===0)
                    ctx.moveTo(x,y);

                else
                    ctx.lineTo(x,y);

            }
        );


        ctx.lineWidth=31;

        ctx.strokeStyle=
            "#252a36";

        ctx.stroke();


        ctx.lineWidth=2;

        ctx.strokeStyle=
            "#4a5060";

        ctx.stroke();


        ctx.setLineDash(
            [8,9]
        );


        ctx.lineWidth=1;

        ctx.strokeStyle=
            "rgba(130,140,155,.35)";

        ctx.stroke();


        ctx.setLineDash([]);

    });


    /* EVENT */

    ctx.fillStyle="#ffcf55";

    ctx.shadowColor="#ffcf55";

    ctx.shadowBlur=10;


    ctx.beginPath();

    ctx.arc(
        W*.50,
        H*.50,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;


    /* DESTINATIONS */

    cargoData.forEach(item=>{

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            return;


        const x=
            item.x*W;

        const y=
            item.y*H;


        const done=
            deliveredCargo.has(
                item.id
            );


        ctx.strokeStyle=
            done
            ? "#5cff9a"
            : "#ffcf55";

        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            17,
            0,
            Math.PI*2
        );

        ctx.stroke();


        ctx.fillStyle=
            done
            ? "#5cff9a"
            : "#ffcf55";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#080910";

        ctx.font=
            "bold 10px Arial";

        ctx.textAlign="center";

        ctx.textBaseline="middle";


        ctx.fillText(
            done
            ? "✓"
            : "!",
            x,
            y
        );

    });


    /* ROUTE */

    if(
        route.length>1
    ){

        ctx.save();


        ctx.beginPath();


        route.forEach(
            (point,index)=>{

                const x=
                    point.x*W;

                const y=
                    point.y*H;


                if(index===0)
                    ctx.moveTo(x,y);

                else
                    ctx.lineTo(x,y);

            }
        );


        /*
           GLOW
        */

        ctx.lineWidth=12;

        ctx.strokeStyle=
            delivering
            ? "rgba(255,60,145,.18)"
            : "rgba(99,245,255,.20)";

        ctx.lineJoin="miter";

        ctx.lineCap="square";

        ctx.stroke();


        /*
           MAIN ROUTE
        */

        ctx.lineWidth=5;

        ctx.strokeStyle=
            delivering
            ? "#ff3c91"
            : "#63f5ff";

        ctx.shadowColor=
            delivering
            ? "#ff3c91"
            : "#63f5ff";

        ctx.shadowBlur=10;

        ctx.stroke();


        ctx.restore();
    }


    /* START */

    const sx=
        startPoint.x*W;

    const sy=
        startPoint.y*H;


    ctx.fillStyle="#63f5ff";

    ctx.shadowColor="#63f5ff";

    ctx.shadowBlur=12;


    ctx.beginPath();

    ctx.arc(
        sx,
        sy,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.fillStyle="#071016";

    ctx.font=
        "bold 10px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    ctx.fillText(
        "S",
        sx,
        sy
    );


    /*
       경로가 아직 없을 때
       시작점 강조
    */

    if(
        planning &&
        route.length===0
    ){

        ctx.strokeStyle=
            "rgba(99,245,255,.35)";

        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            23,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    /*
       현재 경로 끝점
    */

    if(
        planning &&
        route.length>1
    ){

        const last=
            route[
                route.length-1
            ];


        ctx.fillStyle=
            "#ffffff";

        ctx.shadowColor=
            "#63f5ff";

        ctx.shadowBlur=12;


        ctx.beginPath();

        ctx.arc(
            last.x*W,
            last.y*H,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.shadowBlur=0;
    }
}


/* =====================================================
   DELIVERY DRAW
===================================================== */

function drawDelivery(){

    draw();


    const p=
        getDeliveryPosition();


    ctx.save();


    ctx.shadowColor="#ff3c91";

    ctx.shadowBlur=20;

    ctx.fillStyle="#ff3c91";


    ctx.beginPath();

    ctx.arc(
        p.x*W,
        p.y*H,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.fillStyle="#fff";


    ctx.beginPath();

    ctx.arc(
        p.x*W+5,
        p.y*H-4,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* =====================================================
   INPUT EVENTS
===================================================== */

/*
   Pointer Events를 사용하기 때문에
   모바일 터치 + PC 마우스를 모두 지원한다.
*/

canvas.addEventListener(
    "pointerdown",
    pointerDown,
    {passive:false}
);

canvas.addEventListener(
    "pointermove",
    pointerMove,
    {passive:false}
);

canvas.addEventListener(
    "pointerup",
    pointerUp,
    {passive:false}
);

canvas.addEventListener(
    "pointercancel",
    pointerUp,
    {passive:false}
);

</script>
