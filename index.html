<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>CYBER DELIVERY</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#070910;
    color:#fff;

    font-family:Arial,sans-serif;

    touch-action:none;
}

button{
    font-family:inherit;
}


/* =====================================================
   COMMON
===================================================== */

.screen{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:none;
}

.screen.active{
    display:flex;
}


/* =====================================================
   TITLE
===================================================== */

#titleScreen{
    background:
        radial-gradient(
            circle at center,
            #151b2b 0%,
            #080a11 55%,
            #05060a 100%
        );

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;
}

.logo-small{
    color:#63f5ff;
    font-size:11px;
    letter-spacing:5px;

    margin-bottom:15px;
}

.logo{
    font-size:38px;
    font-weight:900;

    letter-spacing:4px;

    color:#fff;

    text-shadow:
        0 0 8px #63f5ff,
        0 0 25px rgba(99,245,255,.5);
}

.logo-sub{
    color:#ff3c91;

    font-size:12px;

    letter-spacing:5px;

    margin-top:10px;
}

.title-city{
    width:100%;
    max-width:360px;

    height:120px;

    margin:35px 0;

    border-top:1px solid #263044;
    border-bottom:1px solid #263044;

    position:relative;

    overflow:hidden;
}

.title-city::before,
.title-city::after{
    content:"";

    position:absolute;

    background:#63f5ff;

    opacity:.35;
}

.title-city::before{
    width:100%;
    height:1px;

    top:35px;
}

.title-city::after{
    width:1px;
    height:100%;

    left:55%;
}

.start-button{
    width:100%;
    max-width:360px;

    padding:17px;

    background:#101722;

    border:2px solid #63f5ff;

    color:#63f5ff;

    font-size:15px;
    font-weight:bold;

    letter-spacing:2px;
}

.version{
    margin-top:15px;

    color:#4d5564;

    font-size:9px;
}


/* =====================================================
   CARGO SELECT
===================================================== */

#cargoScreen{
    background:#080a11;

    flex-direction:column;

    padding:18px;

    overflow:hidden;
}

.cargo-header{
    flex-shrink:0;

    padding:5px 0 15px;

    border-bottom:1px solid #292f3b;
}

.cargo-header h1{
    margin:0;

    color:#63f5ff;

    font-size:21px;

    letter-spacing:2px;
}

.cargo-header p{
    margin:7px 0 0;

    color:#777f8e;

    font-size:11px;
}

.cargo-grid{
    flex:1;

    overflow-y:auto;

    padding:15px 0;

    display:grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap:9px;

    touch-action:pan-y;
}

.cargo-card{
    position:relative;

    min-height:130px;

    padding:13px;

    background:#10141e;

    border:1px solid #303746;

    transition:.15s;
}

.cargo-card.selected{
    border-color:#63f5ff;

    background:#101c25;

    box-shadow:
        inset 0 0 20px
        rgba(99,245,255,.08);
}

.cargo-icon{
    font-size:28px;

    margin-bottom:8px;
}

.cargo-name{
    color:#ddd;

    font-size:11px;
    font-weight:bold;
}

.cargo-destination{
    margin-top:6px;

    color:#777f8e;

    font-size:9px;
}

.cargo-reward{
    margin-top:9px;

    color:#63f5ff;

    font-size:10px;
}

.check{
    position:absolute;

    top:8px;
    right:8px;

    width:19px;
    height:19px;

    border:1px solid #454d5d;

    display:flex;

    align-items:center;
    justify-content:center;

    color:transparent;

    font-size:11px;
}

.cargo-card.selected .check{
    background:#63f5ff;
    color:#071016;

    border-color:#63f5ff;
}

.cargo-footer{
    flex-shrink:0;

    border-top:1px solid #292f3b;

    padding-top:12px;
}

.selected-count{
    color:#777f8e;

    text-align:center;

    font-size:10px;

    margin-bottom:9px;
}

.cargo-start{
    width:100%;

    padding:14px;

    background:#101722;

    border:2px solid #63f5ff;

    color:#63f5ff;

    font-weight:bold;
}

.cargo-start:disabled{
    border-color:#2d3340;
    color:#555b67;
}


/* =====================================================
   GAME
===================================================== */

#gameScreen{
    background:#070910;
}

#gameCanvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    image-rendering:pixelated;
}


/* =====================================================
   HUD
===================================================== */

.hud{
    position:absolute;

    top:0;
    left:0;
    right:0;

    padding:8px;

    pointer-events:none;

    z-index:10;
}

.hud-inner{
    background:rgba(5,7,14,.94);

    border:1px solid #303847;

    padding:9px;

    display:flex;

    justify-content:space-between;

    font-size:10px;
}

.hud-item span{
    color:#63f5ff;
}

.hud-item.damage span{
    color:#ff648d;
}


/* =====================================================
   MESSAGE
===================================================== */

.mode-message{
    position:absolute;

    top:54px;

    left:10px;
    right:10px;

    text-align:center;

    padding:7px;

    background:rgba(5,7,14,.82);

    color:#aeb4c0;

    font-size:10px;

    pointer-events:none;

    z-index:10;
}


/* =====================================================
   DELIVERY STATUS
===================================================== */

.delivery-status{
    display:none;

    position:absolute;

    top:83px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(5,7,14,.94);

    border:1px solid #63f5ff;

    color:#63f5ff;

    padding:7px 13px;

    font-size:10px;

    white-space:nowrap;

    z-index:10;

    pointer-events:none;
}


/* =====================================================
   CARGO HUD
===================================================== */

.cargo-hud{
    position:absolute;

    top:107px;
    left:9px;

    width:150px;

    background:rgba(5,7,14,.86);

    border:1px solid #303847;

    padding:8px;

    z-index:8;

    pointer-events:none;
}

.cargo-hud-title{
    color:#63f5ff;

    font-size:9px;

    margin-bottom:5px;
}

.cargo-hud-item{
    color:#888f9d;

    font-size:8px;

    margin:4px 0;
}

.cargo-hud-item.delivered{
    color:#5cff9a;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
    position:absolute;

    left:10px;
    right:10px;
    bottom:10px;

    display:flex;

    gap:8px;

    z-index:20;
}

.control{
    flex:1;

    padding:14px 5px;

    background:rgba(10,13,21,.96);

    border:1px solid #3a4252;

    color:#bbb;

    font-size:12px;

    font-weight:bold;
}

.control.deliver{
    color:#63f5ff;

    border-color:#63f5ff;
}

.control:disabled{
    color:#555;

    border-color:#292e38;
}


/* =====================================================
   EVENT
===================================================== */

#event{
    display:none;

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(88%,360px);

    padding:20px;

    background:#11141e;

    border:2px solid #ffcf55;

    text-align:center;

    z-index:40;
}

#event h2{
    color:#ffcf55;

    font-size:17px;
}

#event p{
    color:#aaa;

    font-size:11px;

    line-height:1.6;
}

.event-button{
    width:100%;

    padding:12px;

    background:#181c27;

    border:1px solid #ffcf55;

    color:#ffcf55;
}


/* =====================================================
   RESULT
===================================================== */

#resultScreen{
    background:#080910;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.result-box{
    width:100%;
    max-width:400px;

    background:#11141e;

    border:2px solid #63f5ff;

    padding:21px;
}

.result-box h1{
    margin:0;

    text-align:center;

    color:#63f5ff;

    font-size:20px;
}

.grade{
    text-align:center;

    font-size:62px;

    color:#ffd75a;

    margin:13px 0 18px;
}

.result-row{
    display:flex;

    justify-content:space-between;

    padding:10px 0;

    border-bottom:1px solid #292f3a;

    font-size:12px;
}

.result-row strong{
    color:#63f5ff;
}

.restart{
    width:100%;

    margin-top:19px;

    padding:14px;

    background:#111722;

    border:2px solid #63f5ff;

    color:#63f5ff;

    font-weight:bold;
}

</style>
</head>


<body>


<!-- =====================================================
     TITLE
===================================================== -->

<section id="titleScreen"
         class="screen active">

    <div class="logo-small">
        NIGHT CITY LOGISTICS
    </div>

    <div class="logo">
        CYBER<br>DELIVERY
    </div>

    <div class="logo-sub">
        ROUTE • RISK • REWARD
    </div>

    <div class="title-city"></div>

    <button class="start-button"
            onclick="showCargoScreen()">

        START DELIVERY

    </button>

    <div class="version">
        MOBILE PROTOTYPE v0.2
    </div>

</section>


<!-- =====================================================
     CARGO SELECT
===================================================== -->

<section id="cargoScreen"
         class="screen">

    <div class="cargo-header">

        <h1>
            SELECT CARGO
        </h1>

        <p>
            배달할 물품을 선택하세요
        </p>

    <div class="cargo-grid"

    </div>


    <div class="cargo-footer">

             id="selectedCount">

                id="cargoStart"
                onclick="startRoutePlanning()"
                disabled>

            BEGIN ROUTE PLANNING

        </button>

    </div>

</section>


<!-- =====================================================
     GAME
===================================================== -->

<section id="gameScreen"
         class="screen">

    <canvas id="gameCanvas"></canvas>


    <div class="hud">

        <div class="hud-inner">

            <div class="hud-item">
                DIST
                <span id="distance">
                    0m
                </span>
            </div>

            <div class="hud-item">
                CARGO
                <span id="cargoCount">
                    0/0
                </span>
            </div>

            <div class="hud-item damage">
                DAMAGE
                <span id="damage">
                    0%
                </span>
            </div>

        </div>

    </div>


    <div class="mode-message"
         id="modeMessage">

        출발점에서 손가락으로 도로를 따라
        경로를 그리세요

    </div>


    <div class="delivery-status"
         id="deliveryStatus">

        ● DELIVERING...

    </div>


    <div class="cargo-hud"
         id="cargoHud">

        <div class="cargo-hud-title">
            DELIVERY LIST
        </div>

    </div>


    <div class="controls">

        <button class="control"
                id="clearButton"
                onclick="clearRoute()">

            CLEAR

        </button>

        <button class="control deliver"
                id="deliverButton"
                onclick="startDelivery()"
                disabled>

            DELIVER

        </button>

    </div>


    <div id="event">

        <h2 id="eventTitle">
            EVENT
        </h2>

        <p id="eventText"></p>

        <button class="event-button"
                onclick="closeEvent()">

            CONTINUE

        </button>

    </div>

</section>


<!-- =====================================================
     RESULT
===================================================== -->

<section id="resultScreen"
         class="screen">

    <div class="result-box">

        <h1>
            DELIVERY COMPLETE
        </h1>

        <div class="grade"
             id="grade">

            A

        </div>

        <div class="result-row">
            <span>이동거리</span>
            <strong id="resultDistance">0m</strong>
        </div>

        <div class="result-row">
            <span>배송시간</span>
            <strong id="resultTime">0s</strong>
        </div>

        <div class="result-row">
            <span>배송품 손상</span>
            <strong id="resultDamage">0%</strong>
        </div>

        <div class="result-row">
            <span>경로 효율</span>
            <strong id="resultEfficiency">0%</strong>
        </div>

        <div class="result-row">
            <span>보상</span>
            <strong id="resultReward">¥0</strong>
        </div>

        <button class="restart"
                onclick="location.reload()">

            NEXT DELIVERY

        </button>

    </div>

</section>


<script>

/* =====================================================
   DATA
===================================================== */

const cargoData = [

    {
        id:"ramen",
        icon:"🍜",
        name:"NEON RAMEN",
        destination:"Noodle District",
        x:.80,
        y:.20,
        damageRate:.7,
        reward:1200
    },

    {
        id:"medicine",
        icon:"💊",
        name:"MEDICAL CHIP",
        destination:"Medical Sector",
        x:.80,
        y:.80,
        damageRate:1.4,
        reward:2200
    },

    {
        id:"component",
        icon:"🔧",
        name:"CYBER COMPONENT",
        destination:"Industrial Zone",
        x:.20,
        y:.80,
        damageRate:.35,
        reward:1500
    },

    {
        id:"data",
        icon:"💾",
        name:"ENCRYPTED DATA",
        destination:"Data District",
        x:.20,
        y:.20,
        damageRate:.25,
        reward:3000
    },

    {
        id:"bio",
        icon:"🧬",
        name:"BIO SAMPLE",
        destination:"Bio Lab",
        x:.50,
        y:.80,
        damageRate:1.8,
        reward:2800
    },

    {
        id:"luxury",
        icon:"💎",
        name:"LUXURY CHIP",
        destination:"Corporate Tower",
        x:.50,
        y:.20,
        damageRate:1.5,
        reward:5000
    }

];


let selectedCargo=[];


/* =====================================================
   SCREEN CONTROL
===================================================== */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}


/* =====================================================
   CARGO SCREEN
===================================================== */

function showCargoScreen(){

    showScreen("cargoScreen");

    renderCargo();
}


function renderCargo(){

    const grid =
        document.getElementById(
            "cargoGrid"
        );

    grid.innerHTML="";


    cargoData.forEach(item=>{

        const card =
            document.createElement("div");

        card.className="cargo-card";


        if(
            selectedCargo.includes(item.id)
        ){

            card.classList.add(
                "selected"
            );
        }


        card.innerHTML=`

            <div class="check">✓</div>

            <div class="cargo-icon">
                ${item.icon}
            </div>

            <div class="cargo-name">
                ${item.name}
            </div>

            <div class="cargo-destination">
                → ${item.destination}
            </div>

            <div class="cargo-reward">
                ¥${item.reward.toLocaleString()}
            </div>

        `;


        card.addEventListener(
            "click",
            ()=>toggleCargo(item.id)
        );


        grid.appendChild(card);

    });


    updateCargoSelection();
}


function toggleCargo(id){

    const index =
        selectedCargo.indexOf(id);


    if(index>=0){

        selectedCargo.splice(
            index,
            1
        );

    }else{

        selectedCargo.push(id);

    }


    renderCargo();
}


function updateCargoSelection(){

    document.getElementById(
        "selectedCount"
    ).textContent =
        "선택된 물품: "+
        selectedCargo.length+
        "개";


    document.getElementById(
        "cargoStart"
    ).disabled =
        selectedCargo.length===0;
}


/* =====================================================
   MAP
===================================================== */

const roads=[

    [
        [.08,.20],
        [.20,.20],
        [.35,.20],
        [.50,.20],
        [.65,.20],
        [.80,.20],
        [.92,.20]
    ],

    [
        [.08,.50],
        [.20,.50],
        [.35,.50],
        [.50,.50],
        [.65,.50],
        [.80,.50],
        [.92,.50]
    ],

    [
        [.08,.80],
        [.20,.80],
        [.35,.80],
        [.50,.80],
        [.65,.80],
        [.80,.80],
        [.92,.80]
    ],

    [
        [.20,.08],
        [.20,.20],
        [.20,.50],
        [.20,.80],
        [.20,.92]
    ],

    [
        [.50,.08],
        [.50,.20],
        [.50,.50],
        [.50,.80],
        [.50,.92]
    ],

    [
        [.80,.08],
        [.80,.20],
        [.80,.50],
        [.80,.80],
        [.80,.92]
    ]

];


const startPoint={
    x:.08,
    y:.50
};


/* =====================================================
   GAME STATE
===================================================== */

let route=[];

let routeDistance=0;

let drawing=false;

let planning=false;

let delivering=false;

let deliveryProgress=0;

let deliveryStart=0;

let deliveryElapsed=0;

let damage=0;

let deliveredCargo=new Set();

let visitedSegments=new Set();

let triggeredEvents=new Set();

let animationId=null;


/* =====================================================
   START ROUTE PLANNING
===================================================== */

function startRoutePlanning(){

    showScreen("gameScreen");


    planning=true;

    delivering=false;

    route=[];

    routeDistance=0;

    damage=0;

    deliveredCargo.clear();

    visitedSegments.clear();

    triggeredEvents.clear();


    document.getElementById(
        "modeMessage"
    ).textContent =
        "출발점에서 손가락으로 도로를 따라 경로를 그리세요";


    document.getElementById(
        "deliveryStatus"
    ).style.display="none";


    document.getElementById(
        "clearButton"
    ).disabled=false;


    updateCargoHud();

    updateHUD();

    updateDeliverButton();

    resize();

    draw();
}


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


let W=0;
let H=0;


function resize(){

    const dpr =
        Math.min(
            window.devicePixelRatio||1,
            2
        );


    W=window.innerWidth;

    H=window.innerHeight;


    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    draw();
}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   ROAD GEOMETRY
===================================================== */

/*
    각 도로는 여러 개의
    작은 SEGMENT로 나누어진다.

    예:

    A ---- B ---- C

    A-B를 지나갔다면
    A-B는 다시 갈 수 없다.

    하지만

       |
       |
    ---+---

    수직으로 교차하는 것은
    서로 다른 segment이므로 가능하다.
*/


function roadPoint(x,y){

    let best=null;

    let bestDistance=Infinity;

    let bestRoad=-1;

    let bestSegment=-1;


    for(
        let r=0;
        r<roads.length;
        r++
    ){

        const road=roads[r];


        for(
            let s=0;
            s<road.length-1;
            s++
        ){

            const a={
                x:road[s][0]*W,
                y:road[s][1]*H
            };


            const b={
                x:road[s+1][0]*W,
                y:road[s+1][1]*H
            };


            const dx=b.x-a.x;
            const dy=b.y-a.y;


            const len2=
                dx*dx+dy*dy;


            let t=
                (
                    (x-a.x)*dx+
                    (y-a.y)*dy
                )/len2;


            t=Math.max(
                0,
                Math.min(1,t)
            );


            const px=
                a.x+dx*t;

            const py=
                a.y+dy*t;


            const d=
                Math.hypot(
                    x-px,
                    y-py
                );


            if(d<bestDistance){

                bestDistance=d;

                best={
                    x:px/W,
                    y:py/H
                };

                bestRoad=r;
                bestSegment=s;
            }
        }
    }


    return {
        point:best,
        distance:bestDistance,
        road:bestRoad,
        segment:bestSegment
    };
}


/* =====================================================
   SEGMENT KEY
===================================================== */

function segmentKey(road,segment){

    /*
       방향에 상관없이
       같은 도로를 같은 것으로 취급한다.
    */

    return road+"_"+segment;
}


/* =====================================================
   POINTER
===================================================== */

function pointerPosition(e){

    const rect=
        canvas.getBoundingClientRect();


    const touch=
        e.touches
        ? e.touches[0]
        : e;


    return {
        x:touch.clientX-rect.left,
        y:touch.clientY-rect.top
    };
}


function pointerDown(e){

    e.preventDefault();


    if(!planning)
        return;


    const p=
        pointerPosition(e);


    const sx=
        startPoint.x*W;

    const sy=
        startPoint.y*H;


    if(
        Math.hypot(
            p.x-sx,
            p.y-sy
        )>48
    ){

        return;
    }


    drawing=true;


    route=[{
        x:startPoint.x,
        y:startPoint.y
    }];


    routeDistance=0;

    visitedSegments.clear();

    deliveredCargo.clear();


    updateHUD();

    updateCargoHud();

    draw();
}


function pointerMove(e){

    e.preventDefault();


    if(
        !drawing ||
        !planning
    )
        return;


    const p=
        pointerPosition(e);


    const road=
        roadPoint(
            p.x,
            p.y
        );


    /*
       도로에서 너무 멀면
       경로를 추가하지 않는다.
    */

    if(
        !road.point ||
        road.distance>35
    ){

        return;
    }


    const last=
        route[
            route.length-1
        ];


    const dx=
        (road.point.x-last.x)*W;

    const dy=
        (road.point.y-last.y)*H;


    const distance=
        Math.hypot(
            dx,
            dy
        );


    if(distance<4)
        return;


    /*
       =================================================
       이미 지나간 도로인지 검사
       =================================================
    */

    const key=
        segmentKey(
            road.road,
            road.segment
        );


    /*
       같은 segment를 다시 지나가려고 하면
       해당 움직임을 거부한다.

       따라서:

       ------>
       <------

       같은 도로를 되돌아가는 것도 불가능.
    */

    if(
        visitedSegments.has(key)
    ){

        drawing=false;

        document.getElementById(
            "modeMessage"
        ).textContent =
            "⚠ 이미 지나간 도로입니다! 다른 길로 이동하세요";

        setTimeout(()=>{

            if(planning){

                document.getElementById(
                    "modeMessage"
                ).textContent =
                    "출발점에서 손가락으로 도로를 따라 경로를 그리세요";
            }

        },1400);


        return;
    }


    /*
       현재 segment 기록
    */

    visitedSegments.add(key);


    route.push(
        road.point
    );


    routeDistance+=distance;


    checkDestination(
        road.point
    );


    updateHUD();

    updateCargoHud();

    updateDeliverButton();

    draw();
}


function pointerUp(e){

    if(e)
        e.preventDefault();


    drawing=false;

    updateDeliverButton();

    draw();
}


/* =====================================================
   EVENTS
===================================================== */

canvas.addEventListener(
    "touchstart",
    pointerDown,
    {passive:false}
);

canvas.addEventListener(
    "touchmove",
    pointerMove,
    {passive:false}
);

canvas.addEventListener(
    "touchend",
    pointerUp,
    {passive:false}
);

canvas.addEventListener(
    "mousedown",
    pointerDown
);

canvas.addEventListener(
    "mousemove",
    pointerMove
);

canvas.addEventListener(
    "mouseup",
    pointerUp
);


/* =====================================================
   DESTINATIONS
===================================================== */

function checkDestination(point){

    cargoData.forEach(item=>{

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            return;


        if(
            deliveredCargo.has(
                item.id
            )
        )
            return;


        const d=
            Math.hypot(
                point.x-item.x,
                point.y-item.y
            );


        if(d<.055){

            deliveredCargo.add(
                item.id
            );

            updateCargoHud();
        }

    });
}


/* =====================================================
   CLEAR
===================================================== */

function clearRoute(){

    if(!planning)
        return;


    route=[];

    routeDistance=0;

    deliveredCargo.clear();

    visitedSegments.clear();


    document.getElementById(
        "modeMessage"
    ).textContent =
        "출발점에서 손가락으로 도로를 따라 경로를 그리세요";


    updateHUD();

    updateCargoHud();

    updateDeliverButton();

    draw();
}


/* =====================================================
   DELIVER BUTTON
===================================================== */

function updateDeliverButton(){

    const button=
        document.getElementById(
            "deliverButton"
        );


    const complete=
        deliveredCargo.size===
        selectedCargo.length;


    button.disabled=
        !complete ||
        route.length<2 ||
        delivering;
}


/* =====================================================
   START DELIVERY
===================================================== */

function startDelivery(){

    if(
        !planning ||
        delivering
    )
        return;


    if(
        deliveredCargo.size!==
        selectedCargo.length
    )
        return;


    planning=false;

    delivering=true;

    damage=0;

    deliveryProgress=0;

    deliveryStart=
        performance.now();


    document.getElementById(
        "clearButton"
    ).disabled=true;


    document.getElementById(
        "deliverButton"
    ).disabled=true;


    document.getElementById(
        "modeMessage"
    ).textContent =
        "계획한 경로를 따라 배송 중";


    /*
       기존처럼 화면 중앙을 가리는
       팝업이 아니라 작은 상태바.
    */

    document.getElementById(
        "deliveryStatus"
    ).style.display="block";


    deliveredCargo.clear();

    updateCargoHud();


    animationId=
        requestAnimationFrame(
            deliveryLoop
        );
}


/* =====================================================
   DELIVERY
===================================================== */

function deliveryLoop(now){

    if(!delivering)
        return;


    deliveryElapsed=
        (now-deliveryStart)/1000;


    /*
       이전보다 상당히 빠르게.

       약 430px/sec.
    */

    const speed=430;


    const frameDistance=
        speed/60;


    const progressStep=
        frameDistance/10;


    deliveryProgress+=
        progressStep;


    if(
        deliveryProgress>=
        route.length-1
    ){

        finishDelivery();

        return;
    }


    /*
       손상
    */

    const rate=
        getDamageRate();


    damage +=
        frameDistance*
        .0025*
        rate;


    damage=
        Math.min(
            100,
            damage
        );


    /*
       이벤트
    */

    checkEvent();


    drawDelivery();

    updateHUD();


    animationId=
        requestAnimationFrame(
            deliveryLoop
        );
}


/* =====================================================
   DAMAGE
===================================================== */

function getDamageRate(){

    let total=0;

    let count=0;


    selectedCargo.forEach(id=>{

        const item=
            cargoData.find(
                x=>x.id===id
            );


        if(item){

            total+=item.damageRate;

            count++;
        }
    });


    return count
        ? total/count
        : 1;
}


/* =====================================================
   DELIVERY DRAW
===================================================== */

function drawDelivery(){

    draw();


    const index=
        Math.floor(
            deliveryProgress
        );


    const next=
        Math.min(
            index+1,
            route.length-1
        );


    const t=
        deliveryProgress-index;


    const a=
        route[index];

    const b=
        route[next];


    const x=
        a.x+
        (b.x-a.x)*t;


    const y=
        a.y+
        (b.y-a.y)*t;


    /*
       배달 차량
    */

    ctx.save();


    ctx.shadowColor="#ff3c91";

    ctx.shadowBlur=20;


    ctx.fillStyle="#ff3c91";


    ctx.beginPath();

    ctx.arc(
        x*W,
        y*H,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.fillStyle="#fff";


    ctx.beginPath();

    ctx.arc(
        x*W+5,
        y*H-4,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* =====================================================
   EVENT
===================================================== */

function checkEvent(){

    const center={
        x:.50,
        y:.50
    };


    if(
        triggeredEvents.has("center")
    )
        return;


    const index=
        Math.floor(
            deliveryProgress
        );


    if(!route[index])
        return;


    const p=
        route[index];


    if(
        Math.hypot(
            p.x-center.x,
            p.y-center.y
        )<.04
    ){

        triggeredEvents.add(
            "center"
        );


        damage+=5;


        showEvent(
            "⚡ ELECTROMAGNETIC STORM",
            "도시 중앙을 지나던 중 강한<br>" +
            "전자기 폭풍이 발생했습니다.<br><br>" +
            "배송품 손상도 +5%"
        );
    }
}


function showEvent(title,text){

    document.getElementById(
        "eventTitle"
    ).textContent=title;


    document.getElementById(
        "eventText"
    ).innerHTML=text;


    document.getElementById(
        "event"
    ).style.display="block";
}


function closeEvent(){

    document.getElementById(
        "event"
    ).style.display="none";
}


/* =====================================================
   FINISH
===================================================== */

function finishDelivery(){

    delivering=false;


    document.getElementById(
        "deliveryStatus"
    ).style.display="none";


    damage=
        Math.min(
            100,
            damage
        );


    const ideal=
        getIdealDistance();


    const efficiency=
        Math.max(
            0,
            Math.min(
                100,
                100-
                Math.max(
                    0,
                    routeDistance-ideal
                )/8
            )
        );


    let reward=0;


    selectedCargo.forEach(id=>{

        const item=
            cargoData.find(
                x=>x.id===id
            );


        if(item)
            reward+=item.reward;

    });


    reward*=
        Math.max(
            .2,
            1-damage/100
        );


    reward*=
        efficiency/100;


    const score=
        efficiency*.55+
        (100-damage)*.45;


    let grade="D";


    if(score>=92)
        grade="S";
    else if(score>=82)
        grade="A";
    else if(score>=68)
        grade="B";
    else if(score>=52)
        grade="C";


    document.getElementById(
        "resultDistance"
    ).textContent=
        Math.round(
            routeDistance
        )+"m";


    document.getElementById(
        "resultTime"
    ).textContent=
        deliveryElapsed.toFixed(1)+"s";


    document.getElementById(
        "resultDamage"
    ).textContent=
        damage.toFixed(1)+"%";


    document.getElementById(
        "resultEfficiency"
    ).textContent=
        Math.round(
            efficiency
        )+"%";


    document.getElementById(
        "resultReward"
    ).textContent=
        "¥ "+
        Math.round(
            reward
        ).toLocaleString();


    document.getElementById(
        "grade"
    ).textContent=grade;


    showScreen(
        "resultScreen"
    );
}


/* =====================================================
   IDEAL DISTANCE
===================================================== */

function getIdealDistance(){

    /*
       간단한 기준값.

       나중에는 실제 그래프 탐색
       알고리즘으로 최단거리를 계산하도록
       바꿀 수 있다.
    */

    return 750+
        selectedCargo.length*90;
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById(
        "distance"
    ).textContent=
        Math.round(
            routeDistance
        )+"m";


    document.getElementById(
        "cargoCount"
    ).textContent=
        deliveredCargo.size+
        "/"+
        selectedCargo.length;


    document.getElementById(
        "damage"
    ).textContent=
        damage.toFixed(1)+"%";
}


/* =====================================================
   CARGO HUD
===================================================== */

function updateCargoHud(){

    const hud=
        document.getElementById(
            "cargoHud"
        );


    hud.innerHTML=
        `<div class="cargo-hud-title">
            DELIVERY LIST
        </div>`;


    selectedCargo.forEach(id=>{

        const item=
            cargoData.find(
                x=>x.id===id
            );


        if(!item)
            return;


        const div=
            document.createElement("div");


        div.className=
            "cargo-hud-item";


        if(
            deliveredCargo.has(
                id
            )
        ){

            div.classList.add(
                "delivered"
            );
        }


        div.textContent=
            (
                deliveredCargo.has(id)
                ? "✓ "
                : "○ "
            )+
            item.name;


        hud.appendChild(div);

    });
}


/* =====================================================
   DRAW MAP
===================================================== */

function draw(){

    if(!W || !H)
        return;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       BACKGROUND
    */

    ctx.fillStyle="#070910";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       CITY BLOCKS
    */

    for(
        let x=0;
        x<W;
        x+=42
    ){

        for(
            let y=0;
            y<H;
            y+=42
        ){

            const roadX=
                Math.min(
                    Math.abs(x/W-.2),
                    Math.abs(x/W-.5),
                    Math.abs(x/W-.8)
                )<.07;


            const roadY=
                Math.min(
                    Math.abs(y/H-.2),
                    Math.abs(y/H-.5),
                    Math.abs(y/H-.8)
                )<.07;


            if(
                roadX ||
                roadY
            )
                continue;


            ctx.fillStyle=
                ((x+y)/42)%2===0
                ? "#111521"
                : "#0d111a";


            ctx.fillRect(
                x+2,
                y+2,
                36,
                36
            );
        }
    }


    /*
       ROAD
    */

    roads.forEach(path=>{

        ctx.beginPath();


        path.forEach(
            (point,index)=>{

                const x=
                    point[0]*W;

                const y=
                    point[1]*H;


                if(index===0)
                    ctx.moveTo(x,y);
                else
                    ctx.lineTo(x,y);
            }
        );


        ctx.lineWidth=31;

        ctx.strokeStyle="#252a36";

        ctx.stroke();


        ctx.lineWidth=2;

        ctx.strokeStyle="#4a5060";

        ctx.stroke();


        /*
           도로 중앙선
        */

        ctx.setLineDash(
            [8,9]
        );

        ctx.lineWidth=1;

        ctx.strokeStyle=
            "rgba(130,140,155,.35)";

        ctx.stroke();


        ctx.setLineDash([]);
    });


    /*
       CENTER EVENT
    */

    ctx.fillStyle="#ffcf55";

    ctx.shadowColor="#ffcf55";

    ctx.shadowBlur=10;


    ctx.beginPath();

    ctx.arc(
        W*.5,
        H*.5,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    /*
       DESTINATIONS
    */

    cargoData.forEach(item=>{

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            return;


        const x=
            item.x*W;

        const y=
            item.y*H;


        const done=
            deliveredCargo.has(
                item.id
            );


        /*
           외곽 원
        */

        ctx.strokeStyle=
            done
            ? "#5cff9a"
            : "#ffcf55";

        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            17,
            0,
            Math.PI*2
        );

        ctx.stroke();


        /*
           내부
        */

        ctx.fillStyle=
            done
            ? "#5cff9a"
            : "#ffcf55";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#080910";

        ctx.font=
            "bold 10px Arial";

        ctx.textAlign="center";

        ctx.textBaseline="middle";


        ctx.fillText(
            done
            ? "✓"
            : "!",
            x,
            y
        );

    });


    /*
       ROUTE LINE
    */

    if(route.length>1){

        ctx.save();


        ctx.beginPath();


        route.forEach(
            (point,index)=>{

                const x=
                    point.x*W;

                const y=
                    point.y*H;


                if(index===0)
                    ctx.moveTo(x,y);
                else
                    ctx.lineTo(x,y);
            }
        );


        /*
           GLOW
        */

        ctx.lineWidth=10;

        ctx.strokeStyle=
            delivering
            ? "rgba(255,60,145,.18)"
            : "rgba(99,245,255,.20)";

        ctx.stroke();


        /*
           MAIN LINE
        */

        ctx.lineWidth=5;

        ctx.strokeStyle=
            delivering
            ? "#ff3c91"
            : "#63f5ff";

        ctx.shadowColor=
            delivering
            ? "#ff3c91"
            : "#63f5ff";

        ctx.shadowBlur=10;

        ctx.stroke();


        ctx.shadowBlur=0;

        ctx.restore();
    }


    /*
       START
    */

    const sx=
        startPoint.x*W;

    const sy=
        startPoint.y*H;


    ctx.fillStyle="#63f5ff";

    ctx.shadowColor="#63f5ff";

    ctx.shadowBlur=12;


    ctx.beginPath();

    ctx.arc(
        sx,
        sy,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.fillStyle="#071016";

    ctx.font=
        "bold 10px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
        "S",
        sx,
        sy
    );


    /*
       시작점 안내 링
    */

    if(
        planning &&
        route.length===0
    ){

        ctx.strokeStyle=
            "rgba(99,245,255,.35)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            23,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }
}
