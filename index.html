<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>CYBER DELIVERY</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070910;
    color:#fff;
    font-family:Arial,sans-serif;
    touch-action:none;
}

button{
    font-family:inherit;
}

.screen{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:none;
}

.screen.active{
    display:flex;
}


/* =====================================================
   TITLE
===================================================== */

#titleScreen{
    background:
        radial-gradient(
            circle at center,
            #151b2b 0%,
            #080a11 55%,
            #05060a 100%
        );

    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.logo-small{
    color:#63f5ff;
    font-size:11px;
    letter-spacing:5px;
    margin-bottom:15px;
}

.logo{
    font-size:38px;
    font-weight:900;
    letter-spacing:4px;

    color:#fff;

    text-shadow:
        0 0 8px #63f5ff,
        0 0 25px rgba(99,245,255,.5);
}

.logo-sub{
    color:#ff3c91;
    font-size:12px;
    letter-spacing:5px;
    margin-top:10px;
}

.title-city{
    width:100%;
    max-width:360px;
    height:120px;
    margin:35px 0;

    border-top:1px solid #263044;
    border-bottom:1px solid #263044;

    position:relative;
    overflow:hidden;
}

.title-city::before,
.title-city::after{
    content:"";
    position:absolute;
    background:#63f5ff;
    opacity:.35;
}

.title-city::before{
    width:100%;
    height:1px;
    top:35px;
}

.title-city::after{
    width:1px;
    height:100%;
    left:55%;
}

.start-button{
    width:100%;
    max-width:360px;
    padding:17px;

    background:#101722;
    border:2px solid #63f5ff;

    color:#63f5ff;
    font-size:15px;
    font-weight:bold;
    letter-spacing:2px;
}

.version{
    margin-top:15px;
    color:#4d5564;
    font-size:9px;
}


/* =====================================================
   CARGO
===================================================== */

#cargoScreen{
    background:#080a11;

    flex-direction:column;

    padding:18px;

    overflow:hidden;
}

.cargo-header{
    flex-shrink:0;
    padding:5px 0 15px;
    border-bottom:1px solid #292f3b;
}

.cargo-header h1{
    margin:0;
    color:#63f5ff;
    font-size:21px;
    letter-spacing:2px;
}

.cargo-header p{
    margin:7px 0 0;
    color:#777f8e;
    font-size:11px;
}

.cargo-grid{
    flex:1;

    overflow-y:auto;

    padding:15px 0;

    display:grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:9px;

    touch-action:pan-y;
}

.cargo-card{
    position:relative;

    min-height:130px;

    padding:13px;

    background:#10141e;

    border:1px solid #303746;
}

.cargo-card.selected{
    border-color:#63f5ff;

    background:#101c25;

    box-shadow:
        inset 0 0 20px
        rgba(99,245,255,.08);
}

.cargo-icon{
    font-size:28px;
    margin-bottom:8px;
}

.cargo-name{
    color:#ddd;
    font-size:11px;
    font-weight:bold;
}

.cargo-destination{
    margin-top:6px;
    color:#777f8e;
    font-size:9px;
}

.cargo-reward{
    margin-top:9px;
    color:#63f5ff;
    font-size:10px;
}

.check{
    position:absolute;

    top:8px;
    right:8px;

    width:19px;
    height:19px;

    border:1px solid #454d5d;

    display:flex;

    align-items:center;
    justify-content:center;

    color:transparent;

    font-size:11px;
}

.cargo-card.selected .check{
    background:#63f5ff;
    color:#071016;
    border-color:#63f5ff;
}

.cargo-footer{
    flex-shrink:0;

    border-top:1px solid #292f3b;

    padding-top:12px;
}

.selected-count{
    color:#777f8e;
    text-align:center;
    font-size:10px;
    margin-bottom:9px;
}

.cargo-start{
    width:100%;

    padding:14px;

    background:#101722;

    border:2px solid #63f5ff;

    color:#63f5ff;

    font-weight:bold;
}

.cargo-start:disabled{
    border-color:#2d3340;
    color:#555b67;
}


/* =====================================================
   GAME
===================================================== */

#gameScreen{
    background:#070910;
}

#gameCanvas{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    image-rendering:pixelated;

    touch-action:none;
}


/* =====================================================
   HUD
===================================================== */

.hud{
    position:absolute;

    top:0;
    left:0;
    right:0;

    padding:8px;

    pointer-events:none;

    z-index:10;
}

.hud-inner{
    background:rgba(5,7,14,.94);

    border:1px solid #303847;

    padding:9px;

    display:flex;

    justify-content:space-between;

    font-size:10px;
}

.hud-item span{
    color:#63f5ff;
}

.hud-item.damage span{
    color:#ff648d;
}


/* =====================================================
   MESSAGE
===================================================== */

.mode-message{
    position:absolute;

    top:54px;

    left:10px;
    right:10px;

    text-align:center;

    padding:7px;

    background:rgba(5,7,14,.82);

    color:#aeb4c0;

    font-size:10px;

    pointer-events:none;

    z-index:10;
}


/* =====================================================
   DELIVERY STATUS
===================================================== */

.delivery-status{
    display:none;

    position:absolute;

    top:83px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(5,7,14,.94);

    border:1px solid #63f5ff;

    color:#63f5ff;

    padding:7px 13px;

    font-size:10px;

    white-space:nowrap;

    z-index:10;

    pointer-events:none;
}


/* =====================================================
   CARGO HUD
===================================================== */

.cargo-hud{
    position:absolute;

    top:107px;
    left:9px;

    width:160px;

    background:rgba(5,7,14,.86);

    border:1px solid #303847;

    padding:8px;

    z-index:8;

    pointer-events:none;
}

.cargo-hud-title{
    color:#63f5ff;

    font-size:9px;

    margin-bottom:5px;
}

.cargo-hud-item{
    color:#888f9d;

    font-size:8px;

    margin:4px 0;
}

.cargo-hud-item.delivered{
    color:#5cff9a;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
    position:absolute;

    left:10px;
    right:10px;
    bottom:10px;

    display:flex;

    gap:8px;

    z-index:20;
}

.control{
    flex:1;

    padding:14px 5px;

    background:rgba(10,13,21,.96);

    border:1px solid #3a4252;

    color:#bbb;

    font-size:12px;

    font-weight:bold;
}

.control.deliver{
    color:#63f5ff;
    border-color:#63f5ff;
}

.control:disabled{
    color:#555;
    border-color:#292e38;
}


/* =====================================================
   EVENT
===================================================== */

#event{
    display:none;

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(88%,360px);

    padding:20px;

    background:#11141e;

    border:2px solid #ffcf55;

    text-align:center;

    z-index:40;
}

#event h2{
    color:#ffcf55;
    font-size:17px;
}

#event p{
    color:#aaa;

    font-size:11px;

    line-height:1.6;
}

.event-button{
    width:100%;

    padding:12px;

    background:#181c27;

    border:1px solid #ffcf55;

    color:#ffcf55;
}


/* =====================================================
   RESULT
===================================================== */

#resultScreen{
    background:#080910;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.result-box{
    width:100%;
    max-width:400px;

    background:#11141e;

    border:2px solid #63f5ff;

    padding:21px;
}

.result-box h1{
    margin:0;

    text-align:center;

    color:#63f5ff;

    font-size:20px;
}

.grade{
    text-align:center;

    font-size:62px;

    color:#ffd75a;

    margin:13px 0 18px;
}

.result-row{
    display:flex;

    justify-content:space-between;

    padding:10px 0;

    border-bottom:1px solid #292f3a;

    font-size:12px;
}

.result-row strong{
    color:#63f5ff;
}

.restart{
    width:100%;

    margin-top:19px;

    padding:14px;

    background:#111722;

    border:2px solid #63f5ff;

    color:#63f5ff;

    font-weight:bold;
}

</style>
</head>

<body>

===================================================== -->

<!-- =====================================================

===================================================== -->

        </h1>

</section>


<!-- =====================================================
     GAME
===================================================== -->

<section id="gameScreen" class="screen">

        </h1>

        <div class="result-row">

        <div class="result-row">

            <strong id="resultTime">0s</strong>
        </div>

        <div class="result-row">
            <span>배송품 손상</span>
            <strong id="resultDamage">0%</strong>
        </div>

        <div class="result-row">
            <span>경로 효율</span>
            <strong id="resultEfficiency">0%</strong>
        </div>

<script>

/* =====================================================
   CARGO DATA
===================================================== */

const cargoData=[

    {
        id:"ramen",
        icon:"🍜",
        name:"NEON RAMEN",
        destination:"Noodle District",
        x:.80,
        y:.20,
        damageRate:.7,
        reward:1200
    },

    {
        id:"medicine",
        icon:"💊",
        name:"MEDICAL CHIP",
        destination:"Medical Sector",
        x:.80,
        y:.80,
        damageRate:1.4,
        reward:2200
    },

    {
        id:"component",
        icon:"🔧",
        name:"CYBER COMPONENT",
        destination:"Industrial Zone",
        x:.20,
        y:.80,
        damageRate:.35,
        reward:1500
    },

    {
        id:"data",
        icon:"💾",
        name:"ENCRYPTED DATA",
        destination:"Data District",
        x:.20,
        y:.20,
        damageRate:.25,
        reward:3000
    },

    {
        id:"bio",
        icon:"🧬",
        name:"BIO SAMPLE",
        destination:"Bio Lab",
        x:.50,
        y:.80,
        damageRate:1.8,
        reward:2800
    },

    {
        id:"luxury",
        icon:"💎",
        name:"LUXURY CHIP",
        destination:"Corporate Tower",
        x:.50,
        y:.20,
        damageRate:1.5,
        reward:5000
    }

];

let selectedCargo=[];


/* =====================================================
   DOM CACHE
===================================================== */

const $=id=>document.getElementById(id);

const titleScreen=$("titleScreen");
const cargoScreen=$("cargoScreen");
const gameScreen=$("gameScreen");
const resultScreen=$("resultScreen");

const cargoGrid=$("cargoGrid");
const selectedCount=$("selectedCount");
const cargoStart=$("cargoStart");

const distanceEl=$("distance");
const cargoCountEl=$("cargoCount");
const damageEl=$("damage");

const modeMessage=$("modeMessage");
const deliveryStatus=$("deliveryStatus");
const cargoHud=$("cargoHud");

const clearButton=$("clearButton");
const deliverButton=$("deliverButton");

const eventBox=$("event");
const eventTitle=$("eventTitle");
const eventText=$("eventText");


/* =====================================================
   SCREEN
===================================================== */

function showScreen(screen){

    titleScreen.classList.remove("active");
    cargoScreen.classList.remove("active");
    gameScreen.classList.remove("active");
    resultScreen.classList.remove("active");

    screen.classList.add("active");
}


/* =====================================================
   CARGO
===================================================== */

function showCargoScreen(){

    showScreen(cargoScreen);

    renderCargo();
}


function renderCargo(){

    cargoGrid.innerHTML="";

    const selectedSet=new Set(selectedCargo);

    cargoData.forEach(item=>{

        const card=document.createElement("div");

        card.className="cargo-card";

        if(selectedSet.has(item.id))
            card.classList.add("selected");

        card.innerHTML=`

            <div class="check">✓</div>

            <div class="cargo-icon">
                ${item.icon}
            </div>

            <div class="cargo-name">
                ${item.name}
            </div>

            <div class="cargo-destination">
                → ${item.destination}
            </div>

            <div class="cargo-reward">
                ¥${item.reward.toLocaleString()}
            </div>

        `;

        card.addEventListener(
            "click",
            ()=>toggleCargo(item.id)
        );

        cargoGrid.appendChild(card);

    });

    updateCargoSelection();
}


function toggleCargo(id){

    const index=selectedCargo.indexOf(id);

    if(index>=0)
        selectedCargo.splice(index,1);
    else
        selectedCargo.push(id);

    renderCargo();
}


function updateCargoSelection(){

    selectedCount.textContent=
        "선택된 물품: "+
        selectedCargo.length+
        "개";

    cargoStart.disabled=
        selectedCargo.length===0;
}


/* =====================================================
   ROAD MAP
   각 도로를 하나의 블록으로 취급
===================================================== */

/*
   road:
   x1,y1 -> x2,y2

   type:
   horizontal / vertical
*/

const roads=[

    {id:0,x1:.08,y1:.20,x2:.92,y2:.20,type:"h"},
    {id:1,x1:.08,y1:.50,x2:.92,y2:.50,type:"h"},
    {id:2,x1:.08,y1:.80,x2:.92,y2:.80,type:"h"},

    {id:3,x1:.20,y1:.08,x2:.20,y2:.92,type:"v"},
    {id:4,x1:.50,y1:.08,x2:.50,y2:.92,type:"v"},
    {id:5,x1:.80,y1:.08,x2:.80,y2:.92,type:"v"}

];


const startPoint={
    x:.08,
    y:.50
};


/* =====================================================
   GAME STATE
===================================================== */

let route=[];

/*
   routeRoads:
   실제로 선택된 도로의 순서
*/
let routeRoads=[];

/*
   visitedRoads:
   이미 지나간 도로.
   CLEAR 전까지 절대 삭제하지 않는다.
*/
let visitedRoads=new Set();

let routeDistance=0;

let drawing=false;

/*
   현재 드래그 중인 도로와 진행 방향.
   같은 도로에서 뒤로 되돌아가는 입력은 막는다.
*/
let activeRoadId=null;
let activeRoadDirection=0;
let lastPointer=null;

const ROUTE_POINT_MIN_DISTANCE=4;
const INTERSECTION_TOUCH_DISTANCE=52;

let planning=false;

let delivering=false;

let pausedByEvent=false;

let deliveryProgress=0;

let deliveryStart=0;

let deliveryElapsed=0;

let damage=0;

let deliveredCargo=new Set();

let triggeredEvents=new Set();

let W=0;
let H=0;


/* =====================================================
   CANVAS
===================================================== */

const canvas=$("gameCanvas");
const ctx=canvas.getContext("2d");

function resize(){

    const dpr=Math.min(
        window.devicePixelRatio||1,
        2
    );

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );

    draw();
}

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   ROAD HELPERS
===================================================== */

function getRoadPoint(road,t){

    return{
        x:road.x1+
            (road.x2-road.x1)*t,
        y:road.y1+
            (road.y2-road.y1)*t
    };
}

function roadLength(road){

    return Math.hypot(
        (road.x2-road.x1)*W,
        (road.y2-road.y1)*H
    );
}

function clamp01(v){
    return Math.max(0,Math.min(1,v));
}

function projectToRoad(road,x,y){

    const ax=road.x1*W;
    const ay=road.y1*H;
    const bx=road.x2*W;
    const by=road.y2*H;

    const dx=bx-ax;
    const dy=by-ay;
    const len2=dx*dx+dy*dy;

    let t=0;

    if(len2>0){
        t=((x-ax)*dx+(y-ay)*dy)/len2;
    }

    t=clamp01(t);

    const point=getRoadPoint(road,t);

    return{
        road,
        t,
        point,
        x:point.x*W,
        y:point.y*H,
        distance:Math.hypot(x-point.x*W,y-point.y*H)
    };
}

/*
   현재 위치에서 가장 가까운 도로.
   교차로에서는 현재 도로를 우선한다.
*/
function findRoad(x,y){

    let best=null;
    let bestDistance=Infinity;

    for(const road of roads){

        const hit=projectToRoad(road,x,y);

        if(
            road.id===activeRoadId &&
            hit.distance<=bestDistance+8
        ){
            best=hit;
            bestDistance=hit.distance;
            continue;
        }

        if(hit.distance<bestDistance){
            best=hit;
            bestDistance=hit.distance;
        }
    }

    return best && best.distance<=78 ? best : null;
}

function roadsConnected(a,b){

    if(!a || !b || a.id===b.id)
        return false;

    if(a.type===b.type)
        return false;

    const h=a.type==="h" ? a : b;
    const v=a.type==="v" ? a : b;

    return(
        v.x1>=h.x1 &&
        v.x1<=h.x2 &&
        h.y1>=v.y1 &&
        h.y1<=v.y2
    );
}

function getIntersection(a,b){

    if(!roadsConnected(a,b))
        return null;

    const h=a.type==="h" ? a : b;
    const v=a.type==="v" ? a : b;

    return{
        x:v.x1,
        y:h.y1
    };
}

function normalizedDistance(a,b){

    return Math.hypot(
        (a.x-b.x)*W,
        (a.y-b.y)*H
    );
}

function pushRoutePoint(p){

    if(!p)
        return false;

    const last=route[route.length-1];

    if(last && normalizedDistance(last,p)<ROUTE_POINT_MIN_DISTANCE)
        return false;

    route.push({
        x:clamp01(p.x),
        y:clamp01(p.y)
    });

    routeDistance=calculateRouteDistance();
    return true;
}

function getRoadById(id){
    return roads.find(r=>r.id===id)||null;
}

function getLastRoadT(){

    if(route.length===0)
        return null;

    const road=getRoadById(activeRoadId);

    if(!road)
        return null;

    const p=route[route.length-1];

    if(road.type==="h"){
        return clamp01(
            (p.x-road.x1)/(road.x2-road.x1)
        );
    }

    return clamp01(
        (p.y-road.y1)/(road.y2-road.y1)
    );
}

function directionFromT(previousT,currentT){

    const delta=currentT-previousT;

    if(Math.abs(delta)<0.002)
        return 0;

    return delta>0 ? 1 : -1;
}

function isNearStart(hit){

    const sx=startPoint.x*W;
    const sy=startPoint.y*H;

    return Math.hypot(
        hit.x-sx,
        hit.y-sy
    )<=90;
}

function continueOnCurrentRoad(hit){

    const lastT=getLastRoadT();

    if(lastT===null)
        return false;

    const newDirection=directionFromT(lastT,hit.t);

    if(
        activeRoadDirection===0 &&
        newDirection!==0
    ){
        activeRoadDirection=newDirection;
    }

    /*
       같은 도로를 이미 방문했으므로
       현재 진행방향의 반대로 되돌아가는 것을 막는다.
    */
    if(
        activeRoadDirection!==0 &&
        newDirection!==0 &&
        newDirection!==activeRoadDirection
    ){
        showTemporaryMessage(
            "이미 지나간 방향으로 되돌아갈 수 없습니다"
        );
        return false;
    }

    return pushRoutePoint(hit.point);
}

function beginFirstRoad(hit){

    if(!isNearStart(hit)){
        showTemporaryMessage(
            "출발점 근처에서 시작하세요"
        );
        return false;
    }

    activeRoadId=hit.road.id;
    routeRoads=[hit.road];
    visitedRoads.add(hit.road.id);
    activeRoadDirection=0;

    route=[{
        x:startPoint.x,
        y:startPoint.y
    }];

    pushRoutePoint(hit.point);

    lastPointer={x:hit.x,y:hit.y};

    checkDestinationsOnRoute();
    updateAll();
    draw();

    return true;
}

function switchToNextRoad(hit){

    const previous=getRoadById(activeRoadId);

    if(!previous || hit.road.id===previous.id)
        return false;

    if(!roadsConnected(previous,hit.road)){
        showTemporaryMessage(
            "교차로에서 다른 도로로 이동하세요"
        );
        return false;
    }

    if(visitedRoads.has(hit.road.id)){
        showTemporaryMessage(
            "이미 지나간 도로입니다"
        );
        return false;
    }

    const corner=getIntersection(previous,hit.road);

    if(!corner)
        return false;

    const cx=corner.x*W;
    const cy=corner.y*H;

    /*
       새 도로는 실제 교차로 근처에서만 선택 가능.
       멀리 떨어진 도로를 향해 포인터가 순간 이동해도
       경로가 갑자기 꺾이지 않는다.
    */
    if(
        Math.hypot(
            hit.x-cx,
            hit.y-cy
        )>INTERSECTION_TOUCH_DISTANCE
    ){
        return false;
    }

    pushRoutePoint(corner);

    routeRoads.push(hit.road);
    visitedRoads.add(hit.road.id);
    activeRoadId=hit.road.id;
    activeRoadDirection=0;

    /*
       교차로에서 어느 방향으로 출발했는지 결정.
    */
    const cornerT=
        hit.road.type==="h"
            ? clamp01(
                (corner.x-hit.road.x1)/
                (hit.road.x2-hit.road.x1)
            )
            : clamp01(
                (corner.y-hit.road.y1)/
                (hit.road.y2-hit.road.y1)
            );

    activeRoadDirection=
        directionFromT(cornerT,hit.t);

    pushRoutePoint(hit.point);

    lastPointer={x:hit.x,y:hit.y};

    checkDestinationsOnRoute();
    updateAll();
    draw();

    return true;
}

/* =====================================================
   START PLANNING
===================================================== */

function startRoutePlanning(){

    showScreen(gameScreen);

    planning=true;
    delivering=false;
    pausedByEvent=false;
    drawing=false;

    route=[];
    routeRoads=[];
    visitedRoads.clear();

    routeDistance=0;

    damage=0;

    deliveredCargo.clear();
    triggeredEvents.clear();

    activeRoadId=null;
    activeRoadDirection=0;
    lastPointer=null;

    modeMessage.textContent=
        "출발점에서 손가락을 누르고 도로를 따라 경로를 그리세요";

    deliveryStatus.style.display="none";

    clearButton.disabled=false;

    updateCargoHud();
    updateHUD();
    updateDeliverButton();

    resize();
}

/* =====================================================
   POINTER DOWN
===================================================== */

function pointerDown(e){

    e.preventDefault();

    if(
        !planning ||
        delivering ||
        pausedByEvent
    )
        return;

    const rect=canvas.getBoundingClientRect();

    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;

    const hit=findRoad(x,y);

    if(!hit)
        return;

    if(routeRoads.length===0){

        if(beginFirstRoad(hit)){
            drawing=true;
            canvas.setPointerCapture?.(e.pointerId);
            draw();
        }

        return;
    }

    /*
       드래그를 다시 시작할 때는 반드시
       현재 경로의 끝에서 시작해야 한다.
    */
    const end=route[route.length-1];

    if(
        Math.hypot(
            hit.x-end.x*W,
            hit.y-end.y*H
        )>90
    ){
        showTemporaryMessage(
            "현재 경로의 끝에서 이어가세요"
        );
        return;
    }

    drawing=true;
    lastPointer={x,y};
    canvas.setPointerCapture?.(e.pointerId);

    if(hit.road.id===activeRoadId)
        continueOnCurrentRoad(hit);
    else
        switchToNextRoad(hit);

    checkDestinationsOnRoute();
    updateAll();
    draw();
}

/* =====================================================
   POINTER MOVE
===================================================== */

function pointerMove(e){

    e.preventDefault();

    if(
        !drawing ||
        !planning ||
        delivering ||
        pausedByEvent
    )
        return;

    const rect=canvas.getBoundingClientRect();

    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;

    lastPointer={x,y};

    const hit=findRoad(x,y);

    if(!hit)
        return;

    if(hit.road.id===activeRoadId){

        if(continueOnCurrentRoad(hit)){
            checkDestinationsOnRoute();
            updateAll();
            draw();
        }

        return;
    }

    if(switchToNextRoad(hit)){
        checkDestinationsOnRoute();
        updateAll();
        draw();
    }
}

/* =====================================================
   POINTER UP
===================================================== */

function pointerUp(e){

    if(e)
        e.preventDefault();

    if(e?.pointerId!==undefined){
        try{
            canvas.releasePointerCapture?.(e.pointerId);
        }catch(_){}
    }

    drawing=false;
    lastPointer=null;

    updateDeliverButton();
    draw();
}


/* =====================================================
   DESTINATION
===================================================== */

function checkDestinationsOnRoute(){

    if(route.length===0)
        return;

    for(const item of cargoData){

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            continue;

        if(
            deliveredCargo.has(
                item.id
            )
        )
            continue;

        for(const p of route){

            if(
                Math.hypot(
                    p.x-item.x,
                    p.y-item.y
                )<.065
            ){

                deliveredCargo.add(
                    item.id
                );

                break;
            }
        }
    }
}


/* =====================================================
   CLEAR
===================================================== */

function clearRoute(){

    if(!planning)
        return;

    route=[];
    routeRoads=[];

    /*
       여기서만 방문 기록을 초기화한다.
    */

    visitedRoads.clear();

    routeDistance=0;

    deliveredCargo.clear();

    drawing=false;
    activeRoadId=null;
    activeRoadDirection=0;
    lastPointer=null;

    modeMessage.textContent=
        "출발점에서 손가락을 누르고 도로를 따라 경로를 그리세요";

    updateAll();
    draw();
}


/* =====================================================
   ROUTE DISTANCE
===================================================== */

function calculateRouteDistance(){

    let total=0;

    for(
        let i=1;
        i<route.length;
        i++
    ){

        total+=Math.hypot(
            (
                route[i].x-
                route[i-1].x
            )*W,

            (
                route[i].y-
                route[i-1].y
            )*H
        );
    }

    return total;
}


/* =====================================================
   DELIVER BUTTON
===================================================== */

function updateDeliverButton(){

    const complete=
        selectedCargo.length>0 &&
        deliveredCargo.size===
        selectedCargo.length;

    deliverButton.disabled=
        !complete ||
        route.length<2 ||
        delivering;
}


/* =====================================================
   UPDATE
===================================================== */

function updateAll(){

    updateHUD();
    updateCargoHud();
    updateDeliverButton();
}


/* =====================================================
   START DELIVERY
===================================================== */

function startDelivery(){

    if(
        !planning ||
        delivering
    )
        return;

    if(
        deliveredCargo.size!==
        selectedCargo.length
    )
        return;

    planning=false;
    delivering=true;
    pausedByEvent=false;

    damage=0;

    deliveryProgress=0;

    deliveryStart=
        performance.now();

    deliveryElapsed=0;

    deliveredCargo.clear();

    clearButton.disabled=true;
    deliverButton.disabled=true;

    modeMessage.textContent=
        "계획한 경로를 따라 배송 중";

    deliveryStatus.style.display=
        "block";

    updateCargoHud();

    deliveryLoop.lastTime=null;

    requestAnimationFrame(
        deliveryLoop
    );
}


/* =====================================================
   DELIVERY LOOP
===================================================== */

function deliveryLoop(now){

    if(!delivering)
        return;


    /*
       이벤트가 열린 동안
       캐릭터는 완전히 정지한다.
    */

    if(pausedByEvent){

        deliveryLoop.lastTime=now;

        requestAnimationFrame(
            deliveryLoop
        );

        return;
    }


    if(
        deliveryLoop.lastTime===null
    ){

        deliveryLoop.lastTime=now;
    }


    const dt=
        Math.min(
            .05,
            (
                now-
                deliveryLoop.lastTime
            )/1000
        );

    deliveryLoop.lastTime=now;

    deliveryElapsed=
        (
            now-
            deliveryStart
        )/1000;


    /*
       빠른 배송 속도
    */

    const speed=500;

    let remaining=
        speed*dt;


    while(
        remaining>0 &&
        deliveryProgress<
        route.length-1
    ){

        const index=
            Math.floor(
                deliveryProgress
            );

        const fraction=
            deliveryProgress-index;

        const a=
            route[index];

        const b=
            route[index+1];

        const segmentLength=
            Math.hypot(
                (
                    b.x-a.x
                )*W,

                (
                    b.y-a.y
                )*H
            );


        if(segmentLength<=0){

            deliveryProgress=
                index+1;

            continue;
        }


        const remainingOnSegment=
            segmentLength*
            (1-fraction);


        if(
            remaining<
            remainingOnSegment
        ){

            deliveryProgress+=
                remaining/
                segmentLength;

            remaining=0;

        }else{

            remaining-=
                remainingOnSegment;

            deliveryProgress=
                index+1;
        }
    }


    checkDeliveryDestinations();


    const rate=
        getDamageRate();


    damage+=
        speed*
        dt*
        .002*
        rate;


    damage=Math.min(
        100,
        damage
    );


    checkEvent();

    updateHUD();
    updateCargoHud();

    drawDelivery();


    if(
        deliveryProgress>=
        route.length-1
    ){

        finishDelivery();

        return;
    }


    requestAnimationFrame(
        deliveryLoop
    );
}


/* =====================================================
   DELIVERY POSITION
===================================================== */

function getDeliveryPosition(){

    if(route.length===0)
        return startPoint;

    const index=
        Math.floor(
            deliveryProgress
        );


    if(
        index>=route.length-1
    ){

        return route[
            route.length-1
        ];
    }


    const fraction=
        deliveryProgress-index;

    const a=
        route[index];

    const b=
        route[index+1];


    return{

        x:
            a.x+
            (
                b.x-a.x
            )*fraction,

        y:
            a.y+
            (
                b.y-a.y
            )*fraction

    };
}


/* =====================================================
   DELIVERY DESTINATIONS
===================================================== */

function checkDeliveryDestinations(){

    const p=
        getDeliveryPosition();

    for(const item of cargoData){

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            continue;

        if(
            deliveredCargo.has(
                item.id
            )
        )
            continue;

        const d=
            Math.hypot(
                p.x-item.x,
                p.y-item.y
            );

        if(d<.065){

            deliveredCargo.add(
                item.id
            );
        }
    }
}


/* =====================================================
   DAMAGE
===================================================== */

function getDamageRate(){

    let total=0;
    let count=0;

    for(const id of selectedCargo){

        const item=
            cargoData.find(
                x=>x.id===id
            );

        if(item){

            total+=item.damageRate;
            count++;
        }
    }

    return count
        ? total/count
        : 1;
}


/* =====================================================
   EVENT
===================================================== */

function checkEvent(){

    if(
        triggeredEvents.has(
            "center"
        )
    )
        return;


    const p=
        getDeliveryPosition();


    if(
        Math.hypot(
            p.x-.50,
            p.y-.50
        )<.035
    ){

        triggeredEvents.add(
            "center"
        );

        damage+=5;

        /*
           배송 차량 즉시 정지
        */

        pausedByEvent=true;


        showEvent(
            "⚡ ELECTROMAGNETIC STORM",

            "도시 중앙을 지나던 중 강한<br>"+
            "전자기 폭풍이 발생했습니다.<br><br>"+
            "배송품 손상도 +5%"
        );
    }
}


function showEvent(
    title,
    text
){

    eventTitle.textContent=
        title;

    eventText.innerHTML=
        text;

    eventBox.style.display=
        "block";
}


function closeEvent(){

    eventBox.style.display=
        "none";

    /*
       확인 버튼을 누른 뒤에만 재개
    */

    pausedByEvent=false;

    deliveryLoop.lastTime=
        performance.now();

    if(delivering){

        requestAnimationFrame(
            deliveryLoop
        );
    }
}


/* =====================================================
   FINISH
===================================================== */

function finishDelivery(){

    delivering=false;
    pausedByEvent=false;

    deliveryLoop.lastTime=null;

    deliveryStatus.style.display=
        "none";

    damage=Math.min(
        100,
        damage
    );


    const ideal=
        getIdealDistance();


    const efficiency=
        Math.max(
            0,
            Math.min(
                100,

                100-
                Math.max(
                    0,
                    routeDistance-
                    ideal
                )/8
            )
        );


    let reward=0;


    for(const id of selectedCargo){

        const item=
            cargoData.find(
                x=>x.id===id
            );

        if(item)
            reward+=item.reward;
    }


    reward*=
        Math.max(
            .2,
            1-damage/100
        );


    reward*=
        efficiency/100;


    const score=
        efficiency*.55+
        (100-damage)*.45;


    let grade="D";


    if(score>=92)
        grade="S";

    else if(score>=82)
        grade="A";

    else if(score>=68)
        grade="B";

    else if(score>=52)
        grade="C";


    $("resultDistance").textContent=
        Math.round(routeDistance)+"m";

    $("resultTime").textContent=
        deliveryElapsed.toFixed(1)+"s";

    $("resultDamage").textContent=
        damage.toFixed(1)+"%";

    $("resultEfficiency").textContent=
        Math.round(efficiency)+"%";

    $("resultReward").textContent=
        "¥ "+
        Math.round(
            reward
        ).toLocaleString();

    $("grade").textContent=
        grade;


    showScreen(resultScreen);
}


/* =====================================================
   IDEAL DISTANCE
===================================================== */

function getIdealDistance(){

    return(
        750+
        selectedCargo.length*90
    );
}

/* =====================================================
   TEMPORARY MESSAGE
===================================================== */

let messageTimer=null;


function showTemporaryMessage(text){

    modeMessage.textContent=text;

    clearTimeout(
        messageTimer
    );

    messageTimer=
        setTimeout(
            ()=>{

                if(planning){

                    modeMessage.textContent=
                        "출발점에서 손가락을 누르고 도로를 따라 경로를 그리세요";

                }

            },
            1400
        );
}


/* =====================================================
   DRAW MAP
===================================================== */

function draw(){

    if(!W || !H)
        return;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       BACKGROUND
    */

    ctx.fillStyle="#070910";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       CITY BLOCKS
    */

    for(
        let x=0;
        x<W;
        x+=42
    ){

        for(
            let y=0;
            y<H;
            y+=42
        ){

            const roadX=
                roads.some(
                    r=>
                        r.type==="v" &&
                        Math.abs(
                            x/W-r.x1
                        )<.07
                );

            const roadY=
                roads.some(
                    r=>
                        r.type==="h" &&
                        Math.abs(
                            y/H-r.y1
                        )<.07
                );

            if(
                roadX||
                roadY
            )
                continue;


            ctx.fillStyle=
                (
                    (x+y)/42
                )%2===0
                ? "#111521"
                : "#0d111a";


            ctx.fillRect(
                x+2,
                y+2,
                36,
                36
            );
        }
    }


    /*
       ROADS
    */

    for(const road of roads){

        ctx.beginPath();

        ctx.moveTo(
            road.x1*W,
            road.y1*H
        );

        ctx.lineTo(
            road.x2*W,
            road.y2*H
        );

        ctx.lineWidth=31;

        ctx.strokeStyle="#252a36";

        ctx.stroke();


        ctx.lineWidth=2;

        ctx.strokeStyle="#4a5060";

        ctx.stroke();


        ctx.setLineDash(
            [8,9]
        );

        ctx.lineWidth=1;

        ctx.strokeStyle=
            "rgba(130,140,155,.35)";

        ctx.stroke();

        ctx.setLineDash([]);


        /*
           이미 방문한 도로 표시
        */

        if(
            planning &&
            visitedRoads.has(
                road.id
            )
        ){

            ctx.lineWidth=4;

            ctx.strokeStyle=
                "rgba(99,245,255,.12)";

            ctx.stroke();
        }
    }


    /*
       EVENT MARKER
    */

    ctx.fillStyle="#ffcf55";

    ctx.shadowColor="#ffcf55";

    ctx.shadowBlur=10;

    ctx.beginPath();

    ctx.arc(
        W*.50,
        H*.50,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;


    /*
       DESTINATIONS
    */

    for(const item of cargoData){

        if(
            !selectedCargo.includes(
                item.id
            )
        )
            continue;


        const x=item.x*W;
        const y=item.y*H;

        const done=
            deliveredCargo.has(
                item.id
            );


        ctx.strokeStyle=
            done
            ? "#5cff9a"
            : "#ffcf55";

        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            17,
            0,
            Math.PI*2
        );

        ctx.stroke();


        ctx.fillStyle=
            done
            ? "#5cff9a"
            : "#ffcf55";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#080910";

        ctx.font=
            "bold 10px Arial";

        ctx.textAlign="center";
        ctx.textBaseline="middle";


        ctx.fillText(
            done?"✓":"!",
            x,
            y
        );
    }


    /*
       ROUTE
    */

    if(
        route.length>1
    ){

        ctx.save();

        ctx.beginPath();

        for(
            let i=0;
            i<route.length;
            i++
        ){

            const x=
                route[i].x*W;

            const y=
                route[i].y*H;


            if(i===0)
                ctx.moveTo(x,y);

            else
                ctx.lineTo(x,y);
        }


        ctx.lineJoin="miter";
        ctx.lineCap="square";


        ctx.lineWidth=12;

        ctx.strokeStyle=
            delivering
            ? "rgba(255,60,145,.18)"
            : "rgba(99,245,255,.20)";

        ctx.stroke();


        ctx.lineWidth=5;

        ctx.strokeStyle=
            delivering
            ? "#ff3c91"
            : "#63f5ff";

        ctx.shadowColor=
            delivering
            ? "#ff3c91"
            : "#63f5ff";

        ctx.shadowBlur=10;

        ctx.stroke();

        ctx.restore();
    }


    /*
       START
    */

    const sx=
        startPoint.x*W;

    const sy=
        startPoint.y*H;


    ctx.fillStyle="#63f5ff";

    ctx.shadowColor="#63f5ff";

    ctx.shadowBlur=12;


    ctx.beginPath();

    ctx.arc(
        sx,
        sy,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;


    ctx.fillStyle="#071016";

    ctx.font=
        "bold 10px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";


    ctx.fillText(
        "S",
        sx,
        sy
    );


    /*
       START HIGHLIGHT
    */

    if(
        planning &&
        routeRoads.length===0
    ){

        ctx.strokeStyle=
            "rgba(99,245,255,.35)";

        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            23,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    /*
       CURRENT END
    */

    if(
        planning &&
        route.length>1
    ){

        const last=
            route[
                route.length-1
            ];


        ctx.fillStyle="#fff";

        ctx.shadowColor="#63f5ff";

        ctx.shadowBlur=12;


        ctx.beginPath();

        ctx.arc(
            last.x*W,
            last.y*H,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.shadowBlur=0;
    }
}


/* =====================================================
   DELIVERY DRAW
===================================================== */

function drawDelivery(){

    draw();


    const p=
        getDeliveryPosition();


    ctx.save();


    ctx.shadowColor="#ff3c91";

    ctx.shadowBlur=20;

    ctx.fillStyle="#ff3c91";


    ctx.beginPath();

    ctx.arc(
        p.x*W,
        p.y*H,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.fillStyle="#fff";


    ctx.beginPath();

    ctx.arc(
        p.x*W+5,
        p.y*H-4,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}
