<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>CYBER DELIVERY</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070910;
    font-family: Arial, sans-serif;
    color: white;
    touch-action: none;
}

button {
    font-family: inherit;
    -webkit-user-select: none;
    user-select: none;
}


/* =====================================================
   GAME
===================================================== */

#game {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


/* =====================================================
   CANVAS
===================================================== */

#canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    image-rendering: pixelated;
}


/* =====================================================
   TOP HUD
===================================================== */

.hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    padding: 8px;

    pointer-events: none;
    z-index: 10;
}

.hud-inner {
    background: rgba(5, 7, 14, 0.94);

    border: 1px solid #303847;

    padding: 9px;

    display: flex;
    justify-content: space-between;

    font-size: 11px;
}

.hud-item span {
    color: #63f5ff;
}

.hud-item.damage span {
    color: #ff648d;
}


/* =====================================================
   MODE MESSAGE
===================================================== */

.mode-message {
    position: absolute;

    top: 55px;
    left: 10px;
    right: 10px;

    text-align: center;

    padding: 7px;

    background: rgba(5, 7, 14, 0.82);

    color: #aaa;

    font-size: 11px;

    pointer-events: none;

    z-index: 10;
}


/* =====================================================
   DELIVERY STATUS
===================================================== */

.delivery-status {
    position: absolute;

    top: 84px;
    left: 50%;

    transform: translateX(-50%);

    display: none;

    padding: 7px 14px;

    background: rgba(5, 7, 14, 0.92);

    border: 1px solid #63f5ff;

    color: #63f5ff;

    font-size: 11px;

    white-space: nowrap;

    z-index: 10;

    pointer-events: none;
}


/* =====================================================
   CARGO PANEL
===================================================== */

.cargo-panel {
    position: absolute;

    left: 10px;
    top: 110px;

    width: 145px;

    background: rgba(5, 7, 14, 0.88);

    border: 1px solid #303847;

    padding: 8px;

    z-index: 8;

    pointer-events: none;
}

.cargo-title {
    color: #63f5ff;
    font-size: 10px;
    margin-bottom: 6px;
}

.cargo-item {
    display: flex;
    align-items: center;
    gap: 5px;

    font-size: 9px;

    margin: 4px 0;

    color: #aaa;
}

.cargo-item.done {
    color: #5cff9a;
}


/* =====================================================
   BOTTOM CONTROLS
===================================================== */

.controls {
    position: absolute;

    left: 10px;
    right: 10px;
    bottom: 10px;

    display: flex;
    gap: 8px;

    z-index: 20;
}

.control {
    flex: 1;

    padding: 14px 5px;

    background: rgba(10, 13, 21, 0.96);

    border: 1px solid #3a4252;

    color: #bbb;

    font-weight: bold;
    font-size: 13px;
}

.control.deliver {
    border-color: #63f5ff;
    color: #63f5ff;
}

.control.deliver:disabled {
    border-color: #292e38;
    color: #555;
}


/* =====================================================
   RESULT
===================================================== */

#result {
    display: none;

    position: absolute;

    inset: 0;

    background: #080910;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 50;
}

.result-box {
    width: 100%;
    max-width: 400px;

    background: #11141e;

    border: 2px solid #63f5ff;

    padding: 22px;
}

.result-box h1 {
    text-align: center;

    color: #63f5ff;

    font-size: 21px;
}

.grade {
    text-align: center;

    font-size: 65px;

    color: #ffd75a;

    margin: 12px 0 20px;
}

.result-row {
    display: flex;
    justify-content: space-between;

    padding: 11px 0;

    border-bottom: 1px solid #292f3a;

    font-size: 13px;
}

.result-row strong {
    color: #63f5ff;
}

.restart {
    width: 100%;

    margin-top: 20px;

    padding: 15px;

    background: #111722;

    border: 2px solid #63f5ff;

    color: #63f5ff;

    font-weight: bold;
}


/* =====================================================
   EVENT
===================================================== */

#event {
    display: none;

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(88%, 360px);

    background: #11141e;

    border: 2px solid #ffcf55;

    padding: 20px;

    text-align: center;

    z-index: 40;
}

#event h2 {
    color: #ffcf55;

    font-size: 18px;
}

#event p {
    color: #aaa;

    line-height: 1.5;

    font-size: 12px;
}

.event-button {
    width: 100%;

    padding: 12px;

    background: #181c27;

    border: 1px solid #ffcf55;

    color: #ffcf55;
}
</style>
</head>


<body>


<div id="game">


    <!-- =================================================
         CANVAS
    ================================================= -->

    <canvas id="canvas"></canvas>


    <!-- =================================================
         HUD
    ================================================= -->

    <div class="hud">

        <div class="hud-inner">

            <div class="hud-item">
                DIST
                <span id="distance">0m</span>
            </div>

            <div class="hud-item">
                CARGO
                <span id="cargoCount">0/0</span>
            </div>

            <div class="hud-item damage">
                DAMAGE
                <span id="damage">0%</span>
            </div>

        </div>

    </div>


    <!-- =================================================
         MESSAGE
    ================================================= -->

    <div class="mode-message" id="modeMessage">

        출발점에서 손가락으로 도로를 따라
        배달 경로를 그리세요

    </div>


    <!-- =================================================
         DELIVERY STATUS
    ================================================= -->

    <div class="delivery-status"
         id="deliveryStatus">

        ● DELIVERING...

    </div>


    <!-- =================================================
         CARGO
    ================================================= -->

    <div class="cargo-panel">

        <div class="cargo-title">
            TODAY'S CARGO
        </div>

        <div class="cargo-item" id="cargo-ramen">
            🍜 NEON RAMEN
        </div>

        <div class="cargo-item" id="cargo-medicine">
            💊 MEDICAL CHIP
        </div>

        <div class="cargo-item" id="cargo-component">
            🔧 CYBER COMPONENT
        </div>

    </div>


    <!-- =================================================
         CONTROLS
    ================================================= -->

    <div class="controls">

        <button class="control"
                id="clearButton"
                onclick="clearRoute()">

            CLEAR

        </button>

        <button class="control deliver"
                id="deliverButton"
                onclick="startDelivery()"
                disabled>

            DELIVER

        </button>

    </div>


    <!-- =================================================
         EVENT
    ================================================= -->

    <div id="event">

        <h2 id="eventTitle">
            EVENT
        </h2>

        <p id="eventText"></p>

        <button class="event-button"
                onclick="closeEvent()">

            CONTINUE

        </button>

    </div>


    <!-- =================================================
         RESULT
    ================================================= -->

    <div id="result">

        <div class="result-box">

            <h1>
                DELIVERY COMPLETE
            </h1>

            <div class="grade"
                 id="grade">

                A

            </div>

            <div class="result-row">

                <span>
                    이동거리
                </span>

                <strong id="resultDistance">
                    0m
                </strong>

            </div>

            <div class="result-row">

                <span>
                    배송시간
                </span>

                <strong id="resultTime">
                    0s
                </strong>

            </div>

            <div class="result-row">

                <span>
                    배송품 손상
                </span>

                <strong id="resultDamage">
                    0%
                </strong>

            </div>

            <div class="result-row">

                <span>
                    경로 효율
                </span>

                <strong id="resultEfficiency">
                    0%
                </strong>

            </div>

            <div class="result-row">

                <span>
                    보상
                </span>

                <strong id="resultReward">
                    ¥0
                </strong>

            </div>

            <button class="restart"
                    onclick="location.reload()">

                NEXT DELIVERY

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;


function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();
}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   CARGO
===================================================== */

const cargo = [

    {
        id:"ramen",
        name:"NEON RAMEN",
        destination:"north",
        x:.80,
        y:.20,
        damageRate:.7,
        reward:1200
    },

    {
        id:"medicine",
        name:"MEDICAL CHIP",
        destination:"east",
        x:.80,
        y:.80,
        damageRate:1.4,
        reward:2200
    },

    {
        id:"component",
        name:"CYBER COMPONENT",
        destination:"south",
        x:.20,
        y:.80,
        damageRate:.35,
        reward:1500
    }

];


/* =====================================================
   MAP
===================================================== */

/*
    도시의 도로.

    숫자는 화면 크기에 대한 비율이다.
*/

const roads = [

    [
        [.08,.20],
        [.20,.20],
        [.35,.20],
        [.50,.20],
        [.65,.20],
        [.80,.20],
        [.92,.20]
    ],

    [
        [.08,.50],
        [.20,.50],
        [.35,.50],
        [.50,.50],
        [.65,.50],
        [.80,.50],
        [.92,.50]
    ],

    [
        [.08,.80],
        [.20,.80],
        [.35,.80],
        [.50,.80],
        [.65,.80],
        [.80,.80],
        [.92,.80]
    ],

    [
        [.20,.08],
        [.20,.20],
        [.20,.50],
        [.20,.80],
        [.20,.92]
    ],

    [
        [.50,.08],
        [.50,.20],
        [.50,.50],
        [.50,.80],
        [.50,.92]
    ],

    [
        [.80,.08],
        [.80,.20],
        [.80,.50],
        [.80,.80],
        [.80,.92]
    ]

];


/* =====================================================
   GAME STATE
===================================================== */

let route = [];

let routeDistance = 0;

let drawing = false;

let planning = true;

let delivering = false;

let deliveryIndex = 0;

let deliveryStart = 0;

let deliveryElapsed = 0;

let damage = 0;

let deliveredCargo = new Set();

let triggeredEvents = new Set();


const start = {
    x:.08,
    y:.50
};


/* =====================================================
   INITIALIZE
===================================================== */

function init() {

    resize();

    updateHUD();

    draw();
}

init();


/* =====================================================
   FIND NEAREST ROAD
===================================================== */

function nearestRoad(x,y) {

    let best = null;

    let bestDistance = Infinity;


    for(
        let r=0;
        r<roads.length;
        r++
    ) {

        const path =
            roads[r];


        for(
            let i=0;
            i<path.length-1;
            i++
        ) {

            const a = {

                x:path[i][0]*W,
                y:path[i][1]*H

            };


            const b = {

                x:path[i+1][0]*W,
                y:path[i+1][1]*H

            };


            const dx =
                b.x-a.x;

            const dy =
                b.y-a.y;


            const lengthSquared =
                dx*dx+dy*dy;


            let t =
                (
                    (x-a.x)*dx +
                    (y-a.y)*dy
                ) /
                lengthSquared;


            t =
                Math.max(
                    0,
                    Math.min(1,t)
                );


            const px =
                a.x+dx*t;

            const py =
                a.y+dy*t;


            const distance =
                Math.hypot(
                    x-px,
                    y-py
                );


            if(
                distance <
                bestDistance
            ) {

                bestDistance =
                    distance;

                best = {
                    x:px/W,
                    y:py/H
                };
            }
        }
    }


    return {
        point:best,
        distance:bestDistance
    };
}


/* =====================================================
   POINTER POSITION
===================================================== */

function pointerPosition(e) {

    const rect =
        canvas.getBoundingClientRect();


    let x;
    let y;


    if(e.touches) {

        x =
            e.touches[0].clientX;

        y =
            e.touches[0].clientY;

    } else {

        x=e.clientX;
        y=e.clientY;
    }


    return {

        x:x-rect.left,
        y:y-rect.top

    };
}


/* =====================================================
   START ROUTE
===================================================== */

function pointerDown(e) {

    e.preventDefault();


    if(!planning)
        return;


    const p =
        pointerPosition(e);


    const sx =
        start.x*W;

    const sy =
        start.y*H;


    /*
       반드시 출발점 근처에서
       경로를 시작해야 한다.
    */

    if(
        Math.hypot(
            p.x-sx,
            p.y-sy
        ) > 50
    ) {

        return;
    }


    drawing=true;

    route=[{
        x:start.x,
        y:start.y
    }];


    routeDistance=0;

    deliveredCargo.clear();

    updateCargoUI();

    updateHUD();

    draw();
}


/* =====================================================
   DRAW ROUTE
===================================================== */

function pointerMove(e) {

    e.preventDefault();


    if(
        !drawing ||
        !planning
    ) {

        return;
    }


    const p =
        pointerPosition(e);


    const road =
        nearestRoad(
            p.x,
            p.y
        );


    /*
       손가락이 도로에서
       너무 멀리 떨어지면 무시
    */

    if(
        road.distance > 38
    ) {

        return;
    }


    const point =
        road.point;


    const last =
        route[
            route.length-1
        ];


    const distance =
        Math.hypot(
            (point.x-last.x)*W,
            (point.y-last.y)*H
        );


    /*
       너무 짧은 이동은
       점을 추가하지 않는다.
    */

    if(distance < 3)
        return;


    route.push(point);

    routeDistance += distance;


    /*
       목적지 도달 여부
    */

    checkPlanningDestinations(
        point
    );


    updateHUD();

    updateDeliverButton();

    draw();
}


/* =====================================================
   STOP DRAWING
===================================================== */

function pointerUp(e) {

    if(e)
        e.preventDefault();

    drawing=false;

    updateDeliverButton();

    draw();
}


canvas.addEventListener(
    "touchstart",
    pointerDown,
    {passive:false}
);

canvas.addEventListener(
    "touchmove",
    pointerMove,
    {passive:false}
);

canvas.addEventListener(
    "touchend",
    pointerUp,
    {passive:false}
);


canvas.addEventListener(
    "mousedown",
    pointerDown
);

canvas.addEventListener(
    "mousemove",
    pointerMove
);

canvas.addEventListener(
    "mouseup",
    pointerUp
);


/* =====================================================
   DESTINATION CHECK
===================================================== */

function checkPlanningDestinations(point) {

    cargo.forEach(item => {

        if(
            deliveredCargo.has(
                item.id
            )
        ) {

            return;
        }


        const distance =
            Math.hypot(
                point.x-item.x,
                point.y-item.y
            );


        if(distance < .045) {

            deliveredCargo.add(
                item.id
            );

            updateCargoUI();
        }

    });

}


/* =====================================================
   DELIVERY BUTTON
===================================================== */

function updateDeliverButton() {

    const button =
        document.getElementById(
            "deliverButton"
        );


    const allVisited =
        deliveredCargo.size ===
        cargo.length;


    button.disabled =
        !allVisited ||
        route.length < 2 ||
        delivering;
}


/* =====================================================
   CLEAR ROUTE
===================================================== */

function clearRoute() {

    if(!planning)
        return;


    route=[];

    routeDistance=0;

    deliveredCargo.clear();

    updateCargoUI();

    updateDeliverButton();

    updateHUD();

    draw();
}


/* =====================================================
   START DELIVERY
===================================================== */

function startDelivery() {

    if(!planning)
        return;


    if(
        deliveredCargo.size !==
        cargo.length
    ) {

        return;
    }


    planning=false;

    delivering=true;

    deliveryIndex=0;

    deliveryStart=
        performance.now();

    damage=0;


    document.getElementById(
        "clearButton"
    ).disabled=true;


    document.getElementById(
        "deliverButton"
    ).disabled=true;


    document.getElementById(
        "modeMessage"
    ).textContent =
        "계획한 경로를 따라 자동으로 배달합니다";


    /*
       팝업 대신
       상단의 작은 상태 표시만 사용
    */

    document.getElementById(
        "deliveryStatus"
    ).style.display="block";


    /*
       실제 배송 시작 전
       배송 완료 표시를 초기화
    */

    deliveredCargo.clear();

    updateCargoUI();


    requestAnimationFrame(
        deliveryLoop
    );
}


/* =====================================================
   DELIVERY LOOP
===================================================== */

function deliveryLoop(now) {

    if(!delivering)
        return;


    deliveryElapsed =
        (now-deliveryStart)/1000;


    /*
       route의 한 점씩 따라간다.

       실제 게임에서는 이 값을 더 부드럽게
       보간(interpolation)할 수 있다.
    */

    const speed =
        150;


    const moveAmount =
        speed *
        0.016;


    deliveryIndex +=
        moveAmount /
        10;


    if(
        deliveryIndex >=
        route.length-1
    ) {

        finishDelivery();

        return;
    }


    const current =
        route[
            Math.floor(
                deliveryIndex
            )
        ];


    /*
       배송 중 손상 계산
    */

    const sensitivity =
        getAverageDamageRate();


    damage +=
        moveAmount *
        .003 *
        sensitivity;


    /*
       이벤트 확인
    */

    checkDeliveryEvent(
        current
    );


    drawDelivery(
        deliveryIndex
    );


    updateHUD();


    requestAnimationFrame(
        deliveryLoop
    );
}


/* =====================================================
   AVERAGE DAMAGE
===================================================== */

function getAverageDamageRate() {

    let total=0;


    cargo.forEach(item => {

        total +=
            item.damageRate;

    });


    return total /
        cargo.length;
}


/* =====================================================
   DELIVERY EVENT
===================================================== */

function checkDeliveryEvent(point) {

    const eventX=.50;
    const eventY=.50;


    if(
        triggeredEvents.has(
            "center"
        )
    ) {

        return;
    }


    const distance =
        Math.hypot(
            point.x-eventX,
            point.y-eventY
        );


    if(distance < .035) {

        triggeredEvents.add(
            "center"
        );


        damage += 6;


        showEvent(
            "⚡ ELECTROMAGNETIC STORM",
            "강한 전자기파가 도시를 통과했습니다.<br><br>" +
            "배송품 일부가 영향을 받았습니다."
        );
    }
}


/* =====================================================
   DRAW DELIVERY
===================================================== */

function drawDelivery(index) {

    draw();


    const i =
        Math.floor(index);


    const next =
        Math.min(
            i+1,
            route.length-1
        );


    const a =
        route[i];

    const b =
        route[next];


    const t =
        index-i;


    const x =
        a.x+
        (b.x-a.x)*t;


    const y =
        a.y+
        (b.y-a.y)*t;


    /*
       배달원
    */

    ctx.save();


    ctx.fillStyle="#ff3c91";

    ctx.shadowColor="#ff3c91";
    ctx.shadowBlur=16;


    ctx.beginPath();

    ctx.arc(
        x*W,
        y*H,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    /*
       헤드라이트
    */

    ctx.fillStyle="#ffffff";

    ctx.beginPath();

    ctx.arc(
        x*W+5,
        y*H-3,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* =====================================================
   EVENT UI
===================================================== */

function showEvent(
    title,
    text
) {

    document.getElementById(
        "eventTitle"
    ).textContent=title;


    document.getElementById(
        "eventText"
    ).innerHTML=text;


    document.getElementById(
        "event"
    ).style.display="block";
}


function closeEvent() {

    document.getElementById(
        "event"
    ).style.display="none";
}


/* =====================================================
   FINISH
===================================================== */

function finishDelivery() {

    delivering=false;


    document.getElementById(
        "deliveryStatus"
    ).style.display="none";


    damage =
        Math.min(
            100,
            damage
        );


    /*
       경로 효율.

       테스트용 기준거리.
    */

    const idealDistance=850;


    const efficiency =
        Math.max(
            0,
            Math.min(
                100,
                100 -
                Math.max(
                    0,
                    routeDistance-
                    idealDistance
                )/8
            )
        );


    /*
       기본 보상
    */

    let reward=0;


    cargo.forEach(item => {

        reward +=
            item.reward;

    });


    reward *=
        Math.max(
            .2,
            1-damage/100
        );


    reward *=
        efficiency/100;


    /*
       점수
    */

    const score =
        efficiency*.55+
        (100-damage)*.45;


    let grade="D";


    if(score>=92)
        grade="S";

    else if(score>=82)
        grade="A";

    else if(score>=68)
        grade="B";

    else if(score>=52)
        grade="C";


    /*
       결과
    */

    document.getElementById(
        "resultDistance"
    ).textContent =
        Math.round(
            routeDistance
        )+"m";


    document.getElementById(
        "resultTime"
    ).textContent =
        deliveryElapsed.toFixed(1)+"s";


    document.getElementById(
        "resultDamage"
    ).textContent =
        damage.toFixed(1)+"%";


    document.getElementById(
        "resultEfficiency"
    ).textContent =
        Math.round(
            efficiency
        )+"%";


    document.getElementById(
        "resultReward"
    ).textContent =
        "¥ "+
        Math.round(
            reward
        ).toLocaleString();


    document.getElementById(
        "grade"
    ).textContent=grade;


    document.getElementById(
        "result"
    ).style.display="flex";
}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    document.getElementById(
        "distance"
    ).textContent =
        Math.round(
            routeDistance
        )+"m";


    document.getElementById(
        "cargoCount"
    ).textContent =
        deliveredCargo.size+
        "/"+
        cargo.length;


    document.getElementById(
        "damage"
    ).textContent =
        damage.toFixed(1)+"%";
}


/* =====================================================
   CARGO UI
===================================================== */

function updateCargoUI() {

    cargo.forEach(item => {

        const element =
            document.getElementById(
                "cargo-"+item.id
            );


        if(
            deliveredCargo.has(
                item.id
            )
        ) {

            element.classList.add(
                "done"
            );

        } else {

            element.classList.remove(
                "done"
            );
        }

    });
}


/* =====================================================
   DRAW MAP
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       배경
    */

    ctx.fillStyle="#070910";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       도시 블록
    */

    for(
        let x=0;
        x<W;
        x+=42
    ) {

        for(
            let y=0;
            y<H;
            y+=42
        ) {

            const nearRoadX =
                Math.min(
                    Math.abs(x/W-.2),
                    Math.abs(x/W-.5),
                    Math.abs(x/W-.8)
                ) < .07;


            const nearRoadY =
                Math.min(
                    Math.abs(y/H-.2),
                    Math.abs(y/H-.5),
                    Math.abs(y/H-.8)
                ) < .07;


            if(
                nearRoadX ||
                nearRoadY
            )
                continue;


            ctx.fillStyle =
                ((x+y)/42)%2===0
                ? "#111521"
                : "#0d111a";


            ctx.fillRect(
                x+2,
                y+2,
                36,
                36
            );
        }
    }


    /*
       도로
    */

    roads.forEach(path => {

        ctx.beginPath();


        path.forEach(
            (point,index) => {

                const x =
                    point[0]*W;

                const y =
                    point[1]*H;


                if(index===0)
                    ctx.moveTo(x,y);

                else
                    ctx.lineTo(x,y);
            }
        );


        ctx.lineWidth=32;

        ctx.strokeStyle=
            "#252a36";

        ctx.stroke();


        ctx.lineWidth=2;

        ctx.strokeStyle=
            "#454b5a";

        ctx.stroke();
    });


    /*
       이벤트 위치
    */

    ctx.fillStyle="#ffcf55";

    ctx.beginPath();

    ctx.arc(
        W*.50,
        H*.50,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       ★ 핵심 ★

       플레이어가 계획한 경로를
       항상 그린다.
    */

    if(route.length>1) {

        ctx.save();


        ctx.beginPath();


        route.forEach(
            (point,index) => {

                const x =
                    point.x*W;

                const y =
                    point.y*H;


                if(index===0)
                    ctx.moveTo(x,y);

                else
                    ctx.lineTo(x,y);
            }
        );


        /*
           바깥쪽 빛
        */

        ctx.lineWidth=9;

        ctx.strokeStyle=
            "rgba(99,245,255,.18)";

        ctx.stroke();


        /*
           실제 경로 선
        */

        ctx.lineWidth=5;

        ctx.strokeStyle=
            delivering
            ? "#ff3c91"
            : "#63f5ff";


        ctx.shadowColor=
            delivering
            ? "#ff3c91"
            : "#63f5ff";


        ctx.shadowBlur=10;

        ctx.stroke();


        ctx.shadowBlur=0;

        ctx.restore();
    }


    /*
       배송지
    */

    cargo.forEach(item => {

        const x =
            item.x*W;

        const y =
            item.y*H;


        const done =
            deliveredCargo.has(
                item.id
            );


        ctx.fillStyle =
            done
            ? "#5cff9a"
            : "#ffcf55";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            13,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#080910";

        ctx.font=
            "bold 10px Arial";

        ctx.textAlign="center";

        ctx.textBaseline="middle";


        ctx.fillText(
            done ? "✓" : "!",
            x,
            y
        );
    });


    /*
       출발점
    */

    ctx.fillStyle="#63f5ff";

    ctx.beginPath();

    ctx.arc(
        start.x*W,
        start.y*H,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#080910";

    ctx.font=
        "bold 10px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
        "S",
        start.x*W,
        start.y*H
    );


    /*
       계획 단계에서는
       현재 출발점을 다시 표시
    */

    if(
        planning &&
        route.length===0
    ) {

        ctx.strokeStyle=
            "rgba(99,245,255,.35)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            start.x*W,
            start.y*H,
            23,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }
}

</script>
